# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# The front matter of a plan, tracker or handoff under .plans/ (local, so only the write-time hook validates it).
$schema: https://json-schema.org/draft/2020-12/schema
title: Plan front matter
type: object
additionalProperties: false
required: [kind, status, owner_session, updated, pr]
properties:
  kind:
    enum: [tracker, plan, handoff]
  status:
    enum: [active, parked, done]
  owner_session:
    type: string
    minLength: 1
  updated:
    type: string
    format: date
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  # Required for plans and handoffs (below), absent for trackers; "none" when there is no branch.
  branch:
    type: string
    minLength: 1
  pr:
    oneOf:
      - {type: integer, minimum: 1}
      - {const: none}
if:
  properties:
    kind: {enum: [plan, handoff]}
  required: [kind]
then:
  required: [branch]
