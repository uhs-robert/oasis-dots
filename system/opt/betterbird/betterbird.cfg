// betterbird.cfg -- loads home/thunderbird/.config/tbkeys/helpers.js into every tbkeys-bound window
try {
  const bound_window_types = ["mail:3pane", "msgcompose"];

  const helpers_path = () => {
    const file = Services.dirsvc.get("Home", Components.interfaces.nsIFile);
    file.append(".config");
    file.append("tbkeys");
    file.append("helpers.js");
    return file;
  };

  const load_helpers = (win) => {
    try {
      const windowtype = win.document?.documentElement?.getAttribute("windowtype");
      if (!bound_window_types.includes(windowtype)) return;

      const file = helpers_path();
      if (!file.exists()) {
        Services.console.logStringMessage(
          `tbkeys helpers: ${file.path} not found, keybinding helpers not loaded`
        );
        return;
      }

      Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, {
        target: win,
        allowUnsafeURL: true,
      });
    } catch (e) {
      Components.utils.reportError(`tbkeys helpers failed to load: ${e}`);
    }
  };

  const window_observer = {
    observe(win) {
      win.addEventListener("load", () => load_helpers(win), { once: true });
    },
  };

  Services.obs.addObserver(window_observer, "domwindowopened");
} catch (e) {
  Components.utils.reportError(`tbkeys autoconfig failed: ${e}`);
}
