// betterbird.cfg -- loads ~/.config/tbkeys/loader.js into every tbkeys-bound window.
// Kept minimal on purpose: this copy only reaches /opt through install.sh or the
// upgrade hook, so anything likely to change belongs in loader.js instead.
try {
  const bound_window_types = ["mail:3pane", "msgcompose"];

  const load_helpers = (win) => {
    try {
      const windowtype = win.document?.documentElement?.getAttribute("windowtype");
      if (!bound_window_types.includes(windowtype)) return;

      const loader = Services.dirsvc.get("Home", Components.interfaces.nsIFile);
      loader.append(".config");
      loader.append("tbkeys");
      loader.append("loader.js");
      if (!loader.exists()) {
        Services.console.logStringMessage(`tbkeys helpers: ${loader.path} not found, not loaded`);
        return;
      }

      Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(loader).spec, {
        target: win,
        allowUnsafeURL: true,
      });
      const error = win.tbkeys_load_modules();
      if (error) Components.utils.reportError(`tbkeys helpers: ${error}`);
    } catch (e) {
      Components.utils.reportError(`tbkeys helpers failed to load: ${e}`);
    }
  };

  const window_observer = {
    observe(win) {
      win.addEventListener("load", () => load_helpers(win), { once: true });
    },
  };

  Services.obs.addObserver(window_observer, "domwindowopened");
} catch (e) {
  Components.utils.reportError(`tbkeys autoconfig failed: ${e}`);
}
