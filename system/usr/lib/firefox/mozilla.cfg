// mozilla.cfg -- loads every drop-in script from chrome.d (beside this file in the Firefox install dir) into each browser window. Firefox skips this first line.
// chrome.d contract: a file there runs with chrome privileges, once per browser window, after browser-delayed-startup-finished, in name order, each in its own try.
// Only a regular *.js file that no group or other can write and the Firefox user cannot write loads, and only from a real directory that passes the same test.
// Installers put files there as root with `install -m644`, which gives root ownership. A copy that keeps a user owner (`cp -a`, `mv`) is skipped, because that user can rewrite it.
// Never from the profile: a profile is user-writable, so a script there would let any user-level file write run with chrome privileges.
// There is no owner check on purpose. Only a writer of the install dir can create or chown entries in a 0755 chrome.d, and that writer can already rewrite this file.
// Anything that fails a check is skipped and logged. A missing folder loads nothing. A failing script is logged to the browser console, never fatal.
try {
  const dir_name = "chrome.d";
  const group_other_write = 0o022;

  // isSymlink looks at the entry itself, while isFile, isDirectory and permissions follow links, so the symlink test comes first.
  const is_safe = (file, is_wanted_type) => !file.isSymlink() && is_wanted_type(file) && (file.permissions & group_other_write) === 0 && !file.isWritable();

  // isSymlink throws when nothing is there, and it still answers for a dangling link, which must reach the refusal.
  const is_present = (file) => {
    try {
      file.isSymlink();
      return true;
    } catch (e) {
      return false;
    }
  };

  const load_scripts = (win) => {
    try {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      const dir = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
      dir.append(dir_name);
      if (!is_present(dir)) return;
      if (!is_safe(dir, (f) => f.isDirectory())) {
        Components.utils.reportError(`${dir_name} refused: not a real directory the browser user cannot write`);
        return;
      }
      const files = [];
      for (const entry of dir.directoryEntries) {
        const file = entry.QueryInterface(Components.interfaces.nsIFile);
        if (file.leafName.endsWith(".js")) files.push(file);
      }
      files.sort((a, b) => (a.leafName < b.leafName ? -1 : a.leafName > b.leafName ? 1 : 0));
      for (const file of files) {
        try {
          if (!is_safe(file, (f) => f.isFile())) {
            Components.utils.reportError(`${dir_name}/${file.leafName} skipped: not a regular file the browser user cannot write`);
            continue;
          }
          Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, {
            target: win,
            ignoreCache: true,
            allowUnsafeURL: true,
          });
        } catch (e) {
          Components.utils.reportError(`${dir_name}/${file.leafName} failed to load: ${e}`);
        }
      }
    } catch (e) {
      Components.utils.reportError(`${dir_name} loader failed: ${e}`);
    }
  };

  Services.obs.addObserver(load_scripts, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError(`mozilla.cfg failed: ${e}`);
}
