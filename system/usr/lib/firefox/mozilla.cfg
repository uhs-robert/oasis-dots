// mozilla.cfg -- loads <profile>/chrome/bigicons.uc.js into each browser window. Firefox skips this first line.
// One named file, never a glob, so a stray script in a chrome folder does not run with chrome privileges.
// A profile without the file loads nothing. A failing script is logged to the browser console, never fatal.
try {
  const script_name = "bigicons.uc.js";

  const load_script = (win) => {
    try {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      const script = Services.dirsvc.get("UChrm", Components.interfaces.nsIFile);
      script.append(script_name);
      if (!script.exists()) return;
      Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(script).spec, {
        target: win,
        ignoreCache: true,
        allowUnsafeURL: true,
      });
    } catch (e) {
      Components.utils.reportError(`${script_name} failed to load: ${e}`);
    }
  };

  Services.obs.addObserver(load_script, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError(`mozilla.cfg failed: ${e}`);
}
