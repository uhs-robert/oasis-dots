// mozilla.cfg -- loads every drop-in script from chrome.d (root-owned, beside this file in the Firefox install dir) into each browser window. Firefox skips this first line.
// chrome.d contract: a file there runs with chrome privileges, once per browser window, after browser-delayed-startup-finished, in name order, each in its own try.
// Only a root-owned regular *.js file that no group or other can write loads, and only from a root-owned chrome.d that is a real directory no group or other can write.
// Never from the profile: a profile is user-writable, so a script there would let any user-level file write run with chrome privileges.
// The checks use statx without following symlinks, because a symlink in an otherwise safe folder can point into a user-writable place.
// Anything that fails a check is skipped and logged. A missing folder loads nothing. A failing script is logged to the browser console, never fatal.
try {
  const dir_name = "chrome.d";
  const root_uid = 0;
  const type_mask = 0o170000;
  const type_regular = 0o100000;
  const type_directory = 0o040000;
  const group_other_write = 0o022;
  const { ctypes } = ChromeUtils.importESModule("resource://gre/modules/ctypes.sys.mjs");
  const statx_buf = ctypes.ArrayType(ctypes.uint8_t, 256);

  // Returns {type, mode, uid} of the path itself, or null when statx fails.
  const stat_nofollow = (lib_statx, path) => {
    const buf = new statx_buf();
    const at_fdcwd = -100;
    const at_symlink_nofollow = 0x100;
    const statx_type_mode_uid = 0x1 | 0x2 | 0x8;
    if (lib_statx(at_fdcwd, path, at_symlink_nofollow, statx_type_mode_uid, buf) !== 0) return null;
    // struct statx: stx_uid is a u32 at byte 20, stx_mode a u16 at byte 28 (little-endian on every Firefox target).
    const uid = (buf[20] | (buf[21] << 8) | (buf[22] << 16) | (buf[23] << 24)) >>> 0;
    const mode = buf[28] | (buf[29] << 8);
    return { type: mode & type_mask, mode, uid };
  };

  const is_safe = (lib_statx, path, wanted_type) => {
    const st = stat_nofollow(lib_statx, path);
    return st !== null && st.type === wanted_type && st.uid === root_uid && (st.mode & group_other_write) === 0;
  };

  const load_scripts = (win) => {
    try {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      const libc = ctypes.open("libc.so.6");
      try {
        const lib_statx = libc.declare("statx", ctypes.default_abi, ctypes.int, ctypes.int, ctypes.char.ptr, ctypes.int, ctypes.unsigned_int, statx_buf);
        const dir = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
        dir.append(dir_name);
        if (!dir.exists()) return;
        if (!is_safe(lib_statx, dir.path, type_directory)) {
          Components.utils.reportError(`${dir_name} refused: not a root-owned directory that only root can write`);
          return;
        }
        const files = [];
        for (const entry of dir.directoryEntries) {
          const file = entry.QueryInterface(Components.interfaces.nsIFile);
          if (file.leafName.endsWith(".js")) files.push(file);
        }
        files.sort((a, b) => (a.leafName < b.leafName ? -1 : a.leafName > b.leafName ? 1 : 0));
        for (const file of files) {
          try {
            if (!is_safe(lib_statx, file.path, type_regular)) {
              Components.utils.reportError(`${dir_name}/${file.leafName} skipped: not a root-owned regular file that only root can write`);
              continue;
            }
            Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, {
              target: win,
              ignoreCache: true,
              allowUnsafeURL: true,
            });
          } catch (e) {
            Components.utils.reportError(`${dir_name}/${file.leafName} failed to load: ${e}`);
          }
        }
      } finally {
        libc.close();
      }
    } catch (e) {
      Components.utils.reportError(`${dir_name} loader failed: ${e}`);
    }
  };

  Services.obs.addObserver(load_scripts, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError(`mozilla.cfg failed: ${e}`);
}
