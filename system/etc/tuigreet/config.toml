# /etc/tuigreet/config.toml
[display]
show_time = true
time_format = "%I:%M:%S %p"
greeting = "Welcome to the Oasis"
align_greeting = "center"
issue = false

[layout]
width = 80
window_padding = 1
container_padding = 1
prompt_padding = 1

[layout.widgets]
time_position = "top"
status_position = "bottom"

[remember]
username = true
session = false
user_session = true

[user_menu]
enabled = false # TODO: Pending Fix https://github.com/tuigreet/tuigreet/issues/216
min_uid = 1000
max_uid = 60000

[secret]
mode = "characters"
characters = "*"

[keybindings]
command = 1
sessions = 2
background = 4
power = 12

[background]
kind = "matrix" # "none"|"matrix"|"doom"
fps = 30

[background.matrix]
head_color = "#CBEEF9"
bright_color = "#87CEEB"
dim_color = "#1A3D5C"
min_length = 6
max_length = 18
min_speed = 0.30         # rows per frame
max_speed = 1.10
mutate_chance = 0.02     # per-cell glyph shimmer probability

[session]
sessions_dirs = ["/usr/share/wayland-sessions", "/usr/share/xsessions"]
command = "sh -c 'clear; exec /usr/bin/start-hyprland >/tmp/hyprland-greetd.log 2>&1'"

[theme]
container = "black"
text = "white"
title = "blue"
border = "lightblue"
time = "lightblue"
greet = "lightblue"
action = "yellow"
prompt = "yellow"
button = "blue"

# Plain readable input
input = "white"

[[outputs]]
connector = "eDP-1"
primary = true
