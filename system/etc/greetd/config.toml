[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = "next"

# The default session, also known as the greeter.
[default_session]
# command = "/usr/local/bin/tuigreet-oasis"
# greetd runs this as "exec <command>" and parses this file with its own small parser, not full TOML.
# So the command must start with a program (not a shell assignment) and stay a plain quoted string.
command = "dbus-run-session start-hyprland -- -c /etc/greetd/hyprland.lua >/dev/null 2>&1"

# The user to run the command as. The privileges this user must have depends
# on the greeter. A graphical greeter may for example require the user to be
# in the `video` group.
user = "greeter"
