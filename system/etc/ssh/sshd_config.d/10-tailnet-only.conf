# Installed by `just ssh-server` (oasis-dots): SSH by key only, and only from Tailscale addresses.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# Tailscale's IPv4 (CGNAT) and IPv6 ranges; logins from any other address are refused.
AllowUsers *@100.64.0.0/10 *@fd7a:115c:a1e0::/48
