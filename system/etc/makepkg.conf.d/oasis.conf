# makepkg sources this after /etc/makepkg.conf, so it only overrides what it names.
MAKEFLAGS="-j$(nproc)"

# Rewrites the array makepkg.conf set instead of restating it, so other option changes survive.
for oasis_option_index in "${!OPTIONS[@]}"; do
  [[ ${OPTIONS[oasis_option_index]} == debug ]] && OPTIONS[oasis_option_index]='!debug'
done
unset oasis_option_index
