# Lint only (no `ruff format`). The rules are the classic ruff defaults (E4, E7, E9, F), named here because the default
# set of ruff 0.17 is far larger and moves with each release. lib/check/steps/ruff.sh runs this file.
# force-exclude makes the excludes hold for the explicit paths the step passes.
force-exclude = true
extend-exclude = [
  # Vendored-like config that AGENTS.md says not to touch: the qutebrowser config and the Oasis theme files.
  "home/qutebrowser/.config/qutebrowser/config.py",
  "home/qutebrowser/.config/qutebrowser/oasis_*.py",
]

[lint]
select = ["E4", "E7", "E9", "F"]

# Baseline: the hits that existed when the step was added, ignored per file because ruff has no baseline file.
# The gap: a new violation of an ignored rule in a listed file goes unseen, and any other new hit fails.
# Regenerate the entries below with: sh lib/check/steps/ruff.sh --baseline (it ignores the entries already here).
[lint.per-file-ignores]
".claude/skills/shadow/fake_player.py" = ["E402"]
"home/plans/tests/test_retire.py" = ["F401"]
"home/plans/tests/test_server.py" = ["F401", "F811"]
"home/plans/tests/test_server_laptop_key.py" = ["F401"]
"home/quickshell/.config/quickshell/scripts/frame-app-corners" = ["E731"]
"home/quickshell/.config/quickshell/scripts/goldeneye-frames" = ["E402"]
"home/quickshell/.config/quickshell/scripts/synth-sounds" = ["E402"]
"home/quickshell/tests/bar_editor/run.py" = ["E731"]
