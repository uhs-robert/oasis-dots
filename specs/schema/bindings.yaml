# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# home/oasis-djinn/.config/oasis-djinn/bindings/<tool>.json: how one tool performs each action id. quickshell.json: `ipc`
# calls a typed IpcHandler function through qs-ipc; `command` runs a program for what has no IPC function. A word may
# hold `{param}`. hyprland.json: `lua` runs the id's function in hypr's lib/actions/performers.lua. Which kinds a file
# may hold, and that an id is bound in one file only, the registry step checks.
$schema: https://json-schema.org/draft/2020-12/schema
title: Tool bindings
type: object
additionalProperties: false
required: [bindings]
properties:
  bindings:
    type: object
    propertyNames: {pattern: "^[a-z][a-z0-9]*\\.[a-z][a-z0-9_]*$"}
    additionalProperties:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, target, function, args]
          properties:
            kind: {const: ipc}
            target: {type: string, minLength: 1}
            function: {type: string, minLength: 1}
            args:
              type: array
              items: {type: string}
        - type: object
          additionalProperties: false
          required: [kind, argv]
          properties:
            kind: {const: command}
            argv:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {const: lua}
