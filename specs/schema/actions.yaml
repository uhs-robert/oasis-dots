# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# home/oasis-djinn/.config/oasis-djinn/actions.json: the tool-free actions. Which tool performs one is bindings.yaml's business.
# What a schema cannot say (unique ids and param names, a binding for every action) the registry step checks.
$schema: https://json-schema.org/draft/2020-12/schema
title: Action manifest
type: object
additionalProperties: false
required: [actions]
properties:
  actions:
    type: array
    items: {$ref: "#/$defs/action"}
$defs:
  action:
    type: object
    additionalProperties: false
    required: [id, label, intent, params, key, extra_keys]
    properties:
      id: {type: string, pattern: "^[a-z][a-z0-9]*\\.[a-z][a-z0-9_]*$"}
      label: {type: string, minLength: 1}
      intent: {type: string, minLength: 1}
      params:
        type: array
        items: {$ref: "#/$defs/param"}
      key: {$ref: "#/$defs/key"}
      extra_keys:
        type: array
        items: {$ref: "#/$defs/key"}
  # `key` is a Hyprland key string; `leader` puts it behind the leader key, `universal` keeps it live inside submaps.
  key:
    type: object
    additionalProperties: false
    required: [key, leader, universal]
    properties:
      key: {type: string, minLength: 1}
      leader: {type: boolean}
      universal: {type: boolean}
  # Params are positional on the `oasis-djinn` command line, in this order; a trailing run of them may have a default
  # and be left out. What a schema cannot say (an enum default among `values`, defaults only at the end) the registry
  # step checks.
  param:
    type: object
    additionalProperties: false
    required: [name, type]
    properties:
      name: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
      type: {enum: [int, float, string, bool, enum]}
      values:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
      default: {}
    allOf:
      - if:
          properties: {type: {const: enum}}
        then:
          required: [values]
        else:
          not: {required: [values]}
      # A default is the JSON type of its param, so omitting the param cannot run what the same word would reject.
      - if: {properties: {type: {const: int}}}
        then: {properties: {default: {type: integer}}}
      - if: {properties: {type: {const: float}}}
        then: {properties: {default: {type: number}}}
      - if: {properties: {type: {enum: [string, enum]}}}
        then: {properties: {default: {type: string}}}
      - if: {properties: {type: {const: bool}}}
        then: {properties: {default: {type: boolean}}}
