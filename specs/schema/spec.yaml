# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# The front matter of specs/core/<id>.md. The check writes the block to a temp file and validates it against this.
$schema: https://json-schema.org/draft/2020-12/schema
title: Spec front matter
type: object
additionalProperties: false
required: [id, title, status]
properties:
  # Equal to the file name; the specs step checks that, a schema cannot. Letters only, so the requirement prefix is the
  # id in capitals.
  id:
    type: string
    pattern: "^[a-z]{2,}$"
  title:
    type: string
    minLength: 1
  status:
    enum: [draft, approved, implemented, deprecated]
  approved:
    type: string
    format: date
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  prs:
    type: array
    items: {type: integer, minimum: 1}
  implements:
    type: array
    items: {type: string, minLength: 1}
  depends_on:
    type: array
    items: {type: string, pattern: "^[a-z]{2,}$"}
  actions:
    type: array
    items: {type: string, pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9-]*)+$"}
  keys:
    type: array
    items: {type: string, minLength: 1}
# A spec past draft has been approved by the owner on some date.
if:
  properties:
    status: {enum: [approved, implemented, deprecated]}
  required: [status]
then:
  required: [approved]
