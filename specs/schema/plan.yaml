# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# The front matter of a plan, tracker or handoff under .plans/ (local, so only validated where that folder exists).
$schema: https://json-schema.org/draft/2020-12/schema
title: Plan front matter
type: object
additionalProperties: false
required: [kind, status, owner_session, updated, specs, pr]
properties:
  kind:
    enum: [tracker, plan, handoff]
  status:
    enum: [active, parked, done]
  owner_session:
    type: string
    minLength: 1
  updated:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
  specs:
    type: array
    items: {type: string, pattern: "^[a-z]{2,}$"}
  # Plans and handoffs only; "none" when there is no branch.
  branch:
    type: string
    minLength: 1
  pr:
    oneOf:
      - {type: integer, minimum: 1}
      - {const: none}
