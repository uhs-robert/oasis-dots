#    ██║  ██║╚██╗ ██╔╝██╔══██╗██╔══██╗██║     ██╔═══██╗██╔════╝██║ ██╔╝
#    ███████║ ╚████╔╝ ██████╔╝██████╔╝██║     ██║   ██║██║     █████╔╝
#    ██╔══██║  ╚██╔╝  ██╔═══╝ ██╔══██╗██║     ██║   ██║██║     ██╔═██╗
#    ██║  ██║   ██║   ██║     ██║  ██║███████╗╚██████╔╝╚██████╗██║  ██╗
#    ╚═╝  ╚═╝   ╚═╝   ╚═╝     ╚═╝  ╚═╝╚══════╝ ╚═════╝  ╚═════╝╚═╝  ╚═╝
#

# ──────────────────────────────────────────────────────────────────────────── #
# !-- Variables
# ──────────────────────────────────────────────────────────────────────────── #

# !--- Fonts --- #
$font = JetBrains Mono Nerd Font
$font_italic = $font Italic
$font_size_normal = 18
$nerd_font = ProFont IIx Nerd Font Mono

# !--- Colors --- #
source = ~/.config/hypr/theme.conf
$input_bg = rgba(00000000)

# !--- Monitors --- #
$MON_LAPTOP = desc:BOE 0x0C8E
$MON_LEFT = desc:HP Inc. HP Z22n G2 6CM8411J1Z
$MON_CENTER = desc:GIGA-BYTE TECHNOLOGY CO. LTD. G27QC A 0x00000D48
$MON_RIGHT = desc:HP Inc. HP Z22n G2 6CM8411J22

# ──────────────────────────────────────────────────────────────────────────── #
# !-- General
# ──────────────────────────────────────────────────────────────────────────── #

general {
  hide_cursor = false
  ignore_empty_input = true # skip validation when no input provided
  screencopy_mode = 0 # 0: gpu accelerated, 1: cpu based
  immediate_render = true # immediately draw widgets
  bezier = linear, 1, 1, 0, 0
  animation = fade, 1, 1.8, linear
}

# ──────────────────────────────────────────────────────────────────────────── #
# !-- Backgrounds
# ──────────────────────────────────────────────────────────────────────────── #

source = ~/.cache/hyprlock/backgrounds.conf

# ──────────────────────────────────────────────────────────────────────────── #
# !-- Date / Time
# ──────────────────────────────────────────────────────────────────────────── #

# !--- Time --- #
label {
  monitor =
  text = $TIME
  color = $fg_core
  font_size = 100
  font_family = $font
  position = 100, -100
  halign = left
  valign = top
}

# ───────────── #
# !--- Date --- #
# ───────────── #

# !--- Line Decoration
shape {
  monitor =
  size = 30, 2
  color = $theme_primary
  rounding = 0
  border_size = 0
  position = 115, -276
  halign = left
  valign = top
}

# !--- Date String
label {
  monitor =
  text = cmd[update:1000] echo -e "<span> $(date +"%A"), $(date +"%B %d")</span>"
  color = $theme_primary
  font_size = $font_size_normal
  font_family = $font_italic
  position = 145, -260
  halign = left
  valign = top
}

# ──────────────────────────────────────────────────────────────────────────── #
# !-- Login
# ──────────────────────────────────────────────────────────────────────────── #

# !---- User ---- #
#  image {
#   monitor =
#   path = $HOME/.face
#   size = 80
#   border_color = $theme_primary
#   position = -460,300
#   halign = right
#   valign = bottom
# }
label {
  monitor =
  text = $USER
  color = $fg_core
  font_size = 36
  font_family = $font
  position = -95, 290
  halign = right
  valign = bottom
}

# ────────────── #
# !--- Input --- #
# ────────────── #

# !--- Password
input-field {
  monitor =
  hide_input = false
  fade_on_empty = false
  dots_center = false
  size = 420, 60
  rounding = 0
  outline_thickness = 0
  dots_size = 0.4
  dots_spacing = 0.2
  dots_text_format = 󱍿
  outer_color = $theme_primary
  inner_color = $input_bg
  font_color = $theme_secondary
  font_family = $nerd_font
  placeholder_text =
  check_color = $bg_surface_faded
  fail_color = $error_faded
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $warning
  position = -130, 230
  halign = right
  valign = bottom
}

# !--- Underline
shape {
  monitor =
  size = 450, 2
  color = $theme_primary
  rounding = 0
  border_size = 0
  position = -100, 210
  halign = right
  valign = bottom
}

# !--- Arrow
label {
  monitor =
  text =
  onclick = wtype -k Return
  color = $theme_secondary
  font_size = 20
  font_family = $nerd_font
  position = -100, 245
  halign = right
  valign = bottom
}

# ──────────────────────────────────────────────────────────────────────────── #
# !-- PC Controls
# ──────────────────────────────────────────────────────────────────────────── #

# !--- Restart
label {
  monitor =
  text = RESTART
  onclick = systemctl reboot
  color = $fg_muted
  font_size = $font_size_normal
  font_family = $nerd_font
  position = -270, 50
  halign = right
  valign = bottom
}

# !--- Shut Down
label {
  monitor =
  text = SHUT DOWN
  onclick = systemctl poweroff
  color = $fg_muted
  font_size = $font_size_normal
  font_family = $nerd_font
  position = -70, 50
  halign = right
  valign = bottom
}

# !--- Exit Hyprland
label {
  monitor =
  text = EXIT HYPRLAND
  onclick = hyprctl dispatch exit
  color = $fg_muted
  font_size = $font_size_normal
  font_family = $nerd_font
  position = 70, 50
  halign = left
  valign = bottom
}
