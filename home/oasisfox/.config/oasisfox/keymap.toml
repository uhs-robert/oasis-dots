# My OasisFox keymap. Keys that match the built-in defaults are left out.
# Private config (the client, employer and partner containers) joins through keymap.d/ from a private repo.

# sa/Sa, sb/Sb, ...: search with the engine in this tab or a new tab.
[search_keys]
a = "arch"
b = "brave"
c = "crates"
f = "flathub"
h = "hackernews"
i = "imdb"
m = "mdn"
n = "npm"
o = "stackoverflow"
q = "gpt"
r = "reddit"
s = "google"
t = "translate"
w = "wikipedia"
y = "youtube"
z = "wolframalpha"

# cd/Cd, cn/Cn, ...: reopen the page in the container, or prompt in a new tab of it.
[container_keys]
d = "default"
n = "No"
p = "Personal"
r = "Research"

[normal]
# These three open a window with open.url, not the default window.new, so they stay.
W = { run = ":open -w @current_url", label = "New window, edit current URL" }
wo = { run = ":open -w", label = "New window, enter URL" }
ww = { run = ":open -w @current_url", label = "New window, edit current URL" }
ZZ = "browser.close_all"
";f" = { run = "hint", label = "Click element" }
# A generated search key is one key, so the longer families (sgg, sdd, ...) are explicit.
# A leading colon types the command into the command line and waits for the query.
",," = ":search google"
",<" = ":search google -t"
sgg = ":search google"
Sgg = ":search google -t"
sgc = ":search calendar"
Sgc = ":search calendar -t"
sgd = ":search drive"
Sgd = ":search drive -t"
sge = ":search gmail"
Sge = ":search gmail -t"
sgi = ":search image"
Sgi = ":search image -t"
sgm = ":search maps"
Sgm = ":search maps -t"
sgr = ":search redditgoogle"
Sgr = ":search redditgoogle -t"
sgth = ":search lasthour"
Sgth = ":search lasthour -t"
sgtd = ":search lastday"
Sgtd = ":search lastday -t"
sgtw = ":search lastweek"
Sgtw = ":search lastweek -t"
sgtm = ":search lastmonth"
Sgtm = ":search lastmonth -t"
sgty = ":search lastyear"
Sgty = ":search lastyear -t"
sdd = ":search duck"
Sdd = ":search duck -t"
sde = ":search define"
Sde = ":search define -t"
sdu = ":search urbandictionary"
Sdu = ":search urbandictionary -t"
sdy = ":search synonym"
Sdy = ":search synonym -t"
sea = ":search amazon"
Sea = ":search amazon -t"
spb = ":search gamebanana"
Spb = ":search gamebanana -t"
spn = ":search nexusmods"
Spn = ":search nexusmods -t"
spp = ":search proton"
Spp = ":search proton -t"
sps = ":search steam"
Sps = ":search steam -t"

[ignore]
"<S-Insert>" = "mode normal"
"<AC-Escape>" = "mode normal"
"<AC-`>" = "mode normal"

[cmdline]
"<A-ArrowDown>" = "cmdline.next_completion"
"<A-ArrowUp>" = "cmdline.prev_completion"
