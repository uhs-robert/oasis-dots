# My OasisFox keymap. Keys that match the built-in defaults are left out.
# Private config (the client, employer and partner containers) joins through keymap.d/ from a private repo.

# ss/Ss, sy/Sy, ...: search with the engine in this tab or a new tab.
[search_keys]
s = "duck"
y = "youtube"
r = "reddit"
t = "translate"
c = "gpt"
z = "maps"

# cd/Cd, cn/Cn, ...: reopen the page in the container, or prompt in a new tab of it.
[container_keys]
d = "default"
n = "No"
p = "Personal"
r = "Research"

# What which-key shows for each search group, for its s and S prefix.
[group_names]
sg = "Google"
Sg = "Google"
sgt = "Google by time"
Sgt = "Google by time"
se = "Engines"
Se = "Engines"
sa = "AI"
Sa = "AI"
sk = "Knowledge"
Sk = "Knowledge"
sw = "Words"
Sw = "Words"
sd = "Development"
Sd = "Development"
sl = "Linux"
Sl = "Linux"
sm = "Media"
Sm = "Media"
sb = "Buy"
Sb = "Buy"
sp = "Play"
Sp = "Play"

[normal]
# These three open a window with open.url, not the default window.new, so they stay.
W = { run = ":open -w @current_url", label = "New window, edit current URL" }
wo = { run = ":open -w", label = "New window, enter URL" }
ww = { run = ":open -w @current_url", label = "New window, edit current URL" }
ZZ = "browser.close_all"
";f" = { run = "hint", label = "Click element" }
# A generated search key is one key, so the longer families (sgg, sdd, ...) are explicit.
# A leading colon types the command into the command line and waits for the query.
",," = ":search google"
",<" = ":search google -t"
sgg = ":search google"
Sgg = ":search google -t"
