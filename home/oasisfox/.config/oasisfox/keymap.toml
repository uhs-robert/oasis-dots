# The query comes from the clipboard, so it must hold an image URL.
si = "search lens @clipboard"
Si = "search -t lens @clipboard"

[ignore]
"<S-Insert>" = "mode normal"
"<AC-Escape>" = "mode normal"
"<AC-`>" = "mode normal"

[cmdline]
"<A-ArrowDown>" = "cmdline.next_completion"
"<A-ArrowUp>" = "cmdline.prev_completion"
