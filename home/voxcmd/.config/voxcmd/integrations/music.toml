#:schema ../../../.local/share/voxcmd/integration.schema.json
# The bar's music mode (the audio-reactive screen frame) by voice: "music mode on" and "music mode off". The state lives in
# the bar and is set through `qs-ipc call music set`; "toggle music" and "pause music" stay with Media.
name = "Music"
# Not silent: the frame may not draw (frameless styles, nothing built yet), so the owner needs the confirmation.

# Both verbs name "mode", which no Media verb does, and `{target}` catch-alls elsewhere (Apps, Keybinds) are tried only
# after a specific verb has matched, so "music mode on" never reaches them.
verbs = [
  { action = "music_on",  match = 'music mode on|{activate} (the )?music mode' },
  { action = "music_off", match = 'music mode of(f)?|{deactivate} (the )?music mode' },
]

examples = ["music mode on", "music mode off"]

[actions]
music_on = "music_mode_set true"
music_off = "music_mode_set false"
