#:schema ../../../.local/share/voxcmd/integration.schema.json
# Every row of the bar's screenshot menu by voice, through the screenshot tool's own flags (hypr/scripts/screenshot.sh),
# so a capture lands where the Print key's does. Recording is in recording.toml. Format: ~/.config/voxcmd/README.md
name = "Screenshot"
# Each capture opens the bar's selector or saves with its own notification.
silent = true

# "screenshot" alone is not a verb here: it stays with the Keybinds fallback, which opens the menu.
# Written out rather than with `define`: near misses compare the words of the verb text, which a placeholder would hide.
# Scroll and text first: "text from a scrolling capture" must not read as a plain region.
verbs = [
  { action = "scroll_text",  match = 'scroll(ing)? (text|ocr)|(grab|get|read|copy) (the )?text from (a )?scroll(ing)?( capture| screenshot)?' },
  { action = "scroll_image", match = 'scroll(ing)? (screenshot|capture)|(take|grab|make) (a )?scroll(ing)? (screenshot|capture)|scroll image|(((take|grab|make) )?(an? |the |my )?(screen ?shot|capture)( of)?|capture) (a )?scroll(ing)?( (region|area|selection|part of the screen)| page)?' },
  { action = "pixel",        match = 'pick (a |the )?(pixel )?colou?r|(pick|get|grab) (a |the )?pixel( colou?r)?|colou?r picker|eyedropper' },
  { action = "text",         match = '(grab|get|read|copy|extract) (the )?text (from|of) (a |the )?(region|area|selection|part of the screen)|ocr( (a |the )?(region|area|selection|part of the screen))?|text from (a |the )?(region|area|selection|part of the screen)' },
  { action = "frozen",       match = '(((take|grab|make) )?(an? |the |my )?(screen ?shot|capture)( of)?|capture) (a |the )?(frozen|still) (region|area|selection|part of the screen)|((take|grab|capture|make) )?(an? )?(frozen|still|freeze) screen ?shot( of (a |the )?(region|area|selection|part of the screen))?' },
  { action = "focused",      match = '(((take|grab|make) )?(an? |the |my )?(screen ?shot|capture)( of)?|capture) ((this|my|current|focused|active)( current| focused| active)?|the (current|focused|active)) window' },
  { action = "pick_window",  match = '(((take|grab|make) )?(an? |the |my )?(screen ?shot|capture)( of)?|capture) (a |any |the )?window|window screen ?shot' },
  { action = "screen",       match = '(((take|grab|make) )?(an? |the |my )?(screen ?shot|capture)( of)?|capture) (the |my |this )?((whole|entire|full) )?(screen|display|monitor)|((full|whole|entire) )?(screen|display|monitor) screen ?shot|(full|whole|entire) screen ?shot' },
  { action = "region",       match = '(((take|grab|make) )?(an? |the |my )?(screen ?shot|capture)( of)?|capture) (a |an |the )?(region|area|selection|part of the screen)|(region|area|selection|part of the screen) screen ?shot' },
]

examples = [
  "screenshot region",
  "screenshot this window",
  "screenshot the screen",
  "take a frozen screenshot",
  "grab text from a region",
  "pick a color",
  "scrolling screenshot",
  "scroll text",
]

[actions]
region = "capture --region"
frozen = "capture --freeze"
screen = "capture --screen"
pick_window = "capture --window"
focused = "capture --focused"
text = "capture --text"
pixel = "capture --pixel"
scroll_text = "capture --scroll-text"
scroll_image = "capture --scroll-image"
