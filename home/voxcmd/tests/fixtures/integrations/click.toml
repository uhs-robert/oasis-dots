#:schema ../../../.local/share/voxcmd/integration.schema.json
# Clicks visible text in the focused window by OCR: "click sign in", "right click settings", "double click readme".
# "click mode" opens a voice session where each spoken target is clicked without repeating "click".
name = "Click"
target_match = "words"
# The click itself is the feedback; only an error or a missing target shows a toast.
silent = true
# Labels are text read off the screen, so error toasts (kept in the bar's history) leave them out.
private_labels = true
# Several matches are numbered over each text's box on screen, not listed as text.
picker = "hints"
# Not a target even beside a click verb: "click left", "click here", "left click and hold" are the Cursor submap's
# binds, which Keybinds runs when this integration yields nothing.
match_ignore_words = ["left", "right", "middle", "here", "and", "drag", "hold"]

# The mode verbs come first, or "click mode" would be a click on the text "mode". "stop clicking" is here because Media's
# "stop {target}" would otherwise hear it.
verbs = [
  { action = "click_mode",    match = '((start|enter|begin) )?(click|clicking) mode|start clicking' },
  { action = "stop_clicking", match = '{mode_exit}' },
  { action = "right_click",   match = 'right ?click( on)? {target}' },
  { action = "double_click",  match = 'double ?click( on)? {target}' },
  { action = "triple_click",  match = 'triple ?click( on)? {target}' },
  { action = "click",         match = '(left )?click( on)? {target}' },
  { action = "show_hints",    match = '{show} (the )?(click |keyboard |pointer )?hints|hint mode' },
]

examples = ["click mode", "click <text on screen>", "right click <text on screen>", "double click <text on screen>",
  "triple click <text on screen>", "show hints", "stop clicking"]

# A target seen nowhere on screen is reported (no_text) instead of ending as "no match", which would hand
# "click settings" to Keybinds' catch-all.
[actions.click]
provider = "screen_text"
run = "click_at left"
no_match = "no_text"

[actions.right_click]
provider = "screen_text"
run = "click_at right"
no_match = "no_text"

[actions.double_click]
provider = "screen_text"
run = "click_at double"
no_match = "no_text"

[actions.triple_click]
provider = "screen_text"
run = "click_at triple"
no_match = "no_text"

[actions.no_text]
run = 'notify-send --transient --app-name=voxcmd "No \"$VOXCMD_ARG_TARGET\" on screen"'
# A target found nowhere is a turn that did nothing, which counts toward ending click mode.
miss = true

# The same invocation as the Cursor submap's Floating Click (hypr/lib/actions/cursor.lua); detached, since it waits for a key.
[actions.show_hints]
run = "setsid -f wl-kbptr -o modes=floating,click -o mode_floating.source=detect >/dev/null 2>&1 </dev/null"

[actions.click_mode]
enter_mode = true
mode_switch = true

[actions.stop_clicking]
leave_mode = "done"
mode_switch = true

[mode]
label = "Click mode"
# No bare word leaves: "done", "stop", "exit" and "close" are button labels and stay targets; only "cortana ..." leaves.
exit_object = '(the )?(clicking|click mode|clicking mode)'
exit_phrases = 'done clicking|im done clicking|done with {mode_object}|{mode_exit}|exit|quit'
exit_hint = "say cortana done to stop"
default_exits = false
allows_switches = false
# A turn is a target ("sign in") or a click phrase ("right click settings"); a bare "click" and "click mode off" name nothing.
rewrite = { drop = '((left|right|double) )?click|click mode off( (okay|ok|alright|please|now))*', keep = '((left|right|double) )?click .+|clicking mode|start clicking', prefix = "click " }
