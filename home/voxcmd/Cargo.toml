[package]
name = "voxcmd"
version = "0.1.0"
edition = "2024"
description = "Voice command router for the dotfiles' voxcmd package"
publish = false

[[bin]]
name = "voxcmd"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
jiff = "=0.2.37"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
insta = "=1.48.0"
tempfile = "=3.27.0"
