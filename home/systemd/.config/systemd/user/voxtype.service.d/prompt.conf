# Voxtype writes and owns voxtype.service (`voxtype setup systemd`); this only swaps the command it starts.
# voxtype-daemon adds the machine-local prompt.d vocabulary through --initial-prompt, the one way voxtype takes it
# without a public config change, and runs plain `voxtype daemon` when there is none.
[Service]
ExecStart=
ExecStart=%h/.local/bin/voxtype-daemon
