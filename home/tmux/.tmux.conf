# tmux/.tmux.conf
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins/'

# Leader rebind
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

## Sticky prefix: stay in prefix table until toggled off
bind Tab if -F '#{==:#{key-table},prefix}' 'set -u key-table' 'set key-table prefix'
bind Escape set -u key-table

# Preferences
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-position top # status bar on top
set -g status-interval 1 # how often the status updates in seconds
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-window on # renumber windows when they are closed
set -g focus-events on
set -g set-titles on
set -g set-titles-string '#S'
set -g default-shell "/bin/zsh"

# VIM Navigation
setw -g mode-keys vi

## Copy mode
bind-key v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection

## Reload Config
bind-key r source $HOME/.tmux.conf

## Window (tab) Navigation / Management
bind-key h previous-window
bind-key l next-window
bind-key a last-window
bind-key c new-window -c "#{pane_current_path}"

## Session Nav / Management
bind-key j switch-client -p   # previous session
bind-key k switch-client -n   # next session
bind-key R command-prompt "rename-session '%%'" # Rename session
bind-key n command-prompt "new-session -s %%"

## Splits
bind-key V split-window -h -c "#{pane_current_path}" # Vertical
bind-key S split-window -v -c "#{pane_current_path}" # Horizontal

## Pane Management
bind-key -r H resize-pane -L 5   # shrink left
bind-key -r L resize-pane -R 5   # grow right
bind-key -r K resize-pane -U 5   # shrink upward
bind-key -r J resize-pane -D 5   # grow downward
bind-key z resize-pane -Z # Toggle fullscreen active pane
bind-key = select-layout -E # Spread panes evenly
bind-key -r ] next-layout
bind-key -r [ previous-layout
set -g main-pane-width 60%
bind-key Enter select-layout main-vertical \; swap-pane -t '{top-left}' \; select-pane -t '{top-left}' # Promote pane to main

## Move Windows/Panes/Sessions
bind . choose-tree -Zw "join-pane -t '%%'" # Select a window to push the current pane to
bind C-. choose-tree -Zs "join-pane -t '%%'" # Select a session to push current pane to
bind , choose-tree -Z "join-pane -s '%%'"  # Select a pane to pull into the current window
bind m choose-session -Z "move-window -t '%%'" # Move current window → pick a session
bind M choose-tree -Zw "swap-window -t '%%'" # Swap current window ↔ pick a window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Vim Tmux Navigator: Ctrl+hjkl (and Ctrl+Left/Right) move between nvim splits and tmux panes
## Keys go to nvim when it is running, otherwise tmux moves panes and stops at the edges instead of wrapping.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n C-h     if-shell "$is_vim" { send-keys C-h }     { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n C-Left  if-shell "$is_vim" { send-keys C-Left }  { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n C-j     if-shell "$is_vim" { send-keys C-j }     { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n C-k     if-shell "$is_vim" { send-keys C-k }     { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n C-l     if-shell "$is_vim" { send-keys C-l }     { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }
bind-key -n C-Right if-shell "$is_vim" { send-keys C-Right } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }
bind-key -T copy-mode-vi C-h     if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi C-Left  if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi C-j     if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi C-k     if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi C-l     if-shell -F '#{pane_at_right}'  {} { select-pane -R }
bind-key -T copy-mode-vi C-Right if-shell -F '#{pane_at_right}'  {} { select-pane -R }

# Configure Oasis
set -g @oasis_flavor "moonlight_dark"
set -g @oasis_mode_format "icon"

# Bootstap and Initialize TPM
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
## Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
