default_engine = "google"
home_page = "https://web.tabliss.io/"
which_key_border = "chamfer"
# DesertFox reserves new_tab_page for phase 3 and does not apply it yet; set the new-tab override separately until then.
new_tab_page = "https://web.tabliss.io/"

bridge = true

# Follow the desktop theme; the Hyprland theme generator pushes its name with `desertfox theme`.
theme = "desktop"

# Knack snippet keys, only on knack.com and its subdomains (builder.knack.com and hosted apps).
[[site_rules]]
site = "*://*.knack.com/*"

[site_rules.bind]
xh = "knack.toggle_hidden"
xi = "knack.toggle_ids"
xo = "knack.search_prompt"
xs = "knack.logger_switch"

[site_rules.keymap.visual]
xv = "knack.search_selection"
