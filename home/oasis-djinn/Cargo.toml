[package]
name = "oasis-djinn"
version = "0.1.0"
edition = "2024"
description = "The action manifest reader and the `oasis-djinn` command of the dotfiles' oasis-djinn package"
publish = false

# The library is what voxcmd depends on by path; `oasis-djinn` is a thin shell over it.
[lib]
name = "oasis_djinn"
path = "src/lib.rs"

[[bin]]
name = "oasis-djinn"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.dev]
incremental = false

[profile.dev.package."*"]
debug = false
