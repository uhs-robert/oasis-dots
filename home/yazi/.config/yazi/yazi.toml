# yazi/.config/yazi/yazi.toml
[opener]
trash-empty = [
  { run = 'printf "Delete trash older than how many days? "; read age; trash-empty "$age"; printf "\nPress Enter to return to Yazi..."; read _', block = true, desc = "Empty trash by age" },
]
csv = [
  { run = 'nless %s', block = true, desc = "Nless", for = "unix" },
  { run = '/usr/bin/nvim %s', block = true, desc = "NeoVim", for = "unix" },
  { run = 'libreoffice --calc %s', block = false, desc = "Libreoffice", for = "unix" },
]
edit = [
  { run = '/usr/bin/nvim %s', block = true, desc = "NeoVim", for = "unix" },
  { run = 'vim %s', block = true, desc = "Vim", for = "unix" },
  { run = 'nless %s', block = true, desc = "Nless", for = "unix" },
  { run = 'libreoffice --calc %s', block = false, desc = "Libreoffice", for = "unix" },
]
image-edit = [
  { run = 'gimp %s', block = true, desc = "Gimp", for = "unix" },
  { run = 'inkscape %s', block = true, desc = "Inkscape", for = "unix" },
  { run = '/usr/bin/nvim %s', block = true, desc = "NeoVim", for = "unix" },
]
install-rpm = [
  { run = "sh -lc 'sudo dnf -y install \"$1\"' -- \"$@\"", block = true, desc = "DNF Install (sudo)", for = "unix" },
]
video = [
  { run = 'vlc %s', orphan = true, desc = "VLC", for = "unix" },
  { run = 'kdenlive %s', orphan = true, desc = "Kdenlive", for = "unix" },
]
pdf = [{ run = 'zathura %s', orphan = true, desc = "Zathura", for = "unix" }]
just-open = [
  { run = 'xdg-open %s', desc = "Open"}
]
open = [
  { run = 'xdg-open %s', desc = "Open" },
  { run = '/usr/bin/nvim %s', block = true, desc = "NeoVim", for = "unix" },
  { run = 'vim %s', block = true, desc = "Vim", for = "unix" },
  { run = 'gimp %s', block = true, desc = "Gimp", for = "unix" },
  { run = 'inkscape %s', block = true, desc = "Inkscape", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "trash/**", use = ["just-open", "trash","trash-empty"] },
  { url = "*.csv", use = "csv" },
  { mime = "text/csv", use = "csv" },
  { url = "*.rpm", use = "install-rpm" },
  { mime = "image/*", use = "image-edit" },
  { mime = "video/*", use = "video" },
  { mime = "application/pdf", use = "pdf" },
]

[plugin]
prepend_preloaders = [
  # Do not preload files in mounted locations:
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },

  # For mounted location for hard disk/drive
  { url = "/run/media/*/**/*", run = "noop" },
  { url = "~/mnt/*", run = "noop" },
  #... the rest of preloaders
]
prepend_previewers = [
  # Allow to preview folder.
  { url = "*/", run = "folder", sync = true },

  # Do not preview files in mounted locations (uncomment to except text file):
  # { mime = "{text/*,application/x-subrip}", run = "code" },
  { url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { url = "~/mnt/*", run = "noop" },

  # For mounted hard disk.
  { url = "/run/media/*/**/*", run = "noop" },
]
prepend_fetchers = [
  { group = "git", url = "/run/user/1000/gvfs/**/*", run = "noop" },
  { group = "git", url = "/run/media/*/**/*", run = "noop" },
  { group = "git", url = "~/mnt/*", run = "noop" },

  { group = "git", url = "*", run = "git" },
  { group = "git", url = "*/", run = "git" },
]

[preview]
max_width = 1200
max_height = 1200

[mgr]
linemode = "steam_appid"
