<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plans</title>
<style>
  :root {
    --bg: #16181d; --panel: #1f232b; --card: #282d37; --line: #343a46; --text: #d8dee9; --dim: #8a93a5;
    --accent: #88c0d0; --warn: #ebcb8b; --bad: #bf616a; --good: #a3be8c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 8px 0 0; font-size: 15px; }
  header select, header input { background: var(--card); color: var(--text); border: 1px solid var(--line);
                                border-radius: 4px; padding: 3px 6px; font: inherit; }
  header input[type=text] { width: 14em; }
  #repo-picker { position: relative; }
  #repo { width: 16em; }
  #repo-list { position: absolute; top: 100%; left: 0; z-index: 8; display: none; min-width: 100%; max-height: 50vh;
               overflow-y: auto; margin: 2px 0 0; padding: 2px 0; list-style: none; background: var(--card);
               border: 1px solid var(--line); border-radius: 4px; }
  #repo-list.open { display: block; }
  #repo-list li { padding: 3px 8px; white-space: nowrap; cursor: pointer; }
  #repo-list li.active { background: var(--line); color: var(--accent); }
  #repo-list li.chosen { font-weight: 600; }
  #repo-list li.none { color: var(--dim); cursor: default; }
  header label { color: var(--dim); }
  #keys { margin-left: auto; color: var(--dim); font-size: 12px; }
  #message { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10; display: none;
             max-width: 80vw; padding: 8px 14px; border-radius: 6px; background: var(--bad); color: #fff; }
  #message.info { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  #board { display: grid; padding: 0 12px 40px; }
  :root { --header-h: 42px; --column-row-h: 26px; --repo-head-h: 36px; }
  /* Lets scrollIntoView clear all three pinned bars. */
  html { scroll-padding-top: calc(var(--header-h) + var(--column-row-h) + var(--repo-head-h)); }
  /* Sticky only works against the whole board, so the column heads share one row spanning the grid. Subgrid keeps
     the tracks identical to the cell rows below. */
  #column-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; position: sticky;
                top: var(--header-h); z-index: 4; background: var(--bg); }
  .column-head { padding: 6px; color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: 11px;
                 border-bottom: 1px solid var(--line); }
  /* One section per repo: a sticky head stays pinned only inside its own section, so the next repo's head takes over. */
  .repo-section { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
  /* Padding, not margin, for the gap above: a margin would leave the sticky box short and let cards show in it. */
  .repo-head { grid-column: 1 / -1; position: sticky; top: calc(var(--header-h) + var(--column-row-h)); z-index: 3;
               padding: 14px 0 4px; background: var(--bg); font-size: 14px; font-weight: 600; color: var(--accent); }
  .lane-head { grid-column: 1 / -1; padding: 2px 0 0 4px; color: var(--dim); font-size: 12px; }
  .cell { min-height: 34px; padding: 3px; border-right: 1px dashed var(--line); }
  .card { margin: 3px 0; padding: 5px 7px; background: var(--card); border: 1px solid var(--line);
          border-left: 3px solid var(--dim); border-radius: 4px; cursor: default; user-select: none; }
  .card.selected { outline: 2px solid var(--accent); }
  .card.waiting { border-left-color: var(--warn); }
  .card.problem { border-left-color: var(--bad); background: #3a2a2e; }
  .card .id { font-weight: 600; word-break: break-all; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; color: var(--dim); font-size: 11px; }
  .card .waiting-on { margin-top: 3px; color: var(--warn); font-size: 12px; }
  .card .error { margin-top: 3px; color: #f0b8bd; font-size: 11px; word-break: break-word; }
  .badge { padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }
  .badge.depends { color: var(--accent); }
  a { color: var(--accent); }
  .card.dragging { position: relative; z-index: 6; opacity: 0.85; pointer-events: none; }
  .drop-marker { height: 3px; margin: -1px 0; background: var(--accent); border-radius: 2px; }
  .owner-input { width: 100%; margin-top: 3px; background: var(--bg); color: var(--text);
                 border: 1px solid var(--accent); border-radius: 3px; font: inherit; }
  #confirm { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
             background: rgba(0, 0, 0, 0.5); }
  #confirm div { padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-width: 70ch; }
  .hidden { display: none !important; }
  /* The phone layout (html.phone, set below PHONE_MAX_WIDTH): one status at a time as tabs, and a sheet per card.
     None of it shows on a wide screen. */
  #tabs, #sheet, #confirm .phone-only { display: none; }
  html.phone { scroll-padding-top: var(--tabs-h, 40px); }
  html.phone header { position: static; }
  html.phone #keys, html.phone #status { display: none; }
  html.phone #repo-picker { flex: 1 1 100%; }
  html.phone #repo, html.phone #text { width: 100%; }
  html.phone #text { flex: 1 1 100%; }
  html.phone #tabs { display: flex; position: sticky; top: 0; z-index: 5; overflow-x: auto; scrollbar-width: none;
                     background: var(--panel); border-bottom: 1px solid var(--line); }
  #tabs button { flex: none; padding: 11px 10px 9px; background: none; border: 0; border-bottom: 2px solid transparent;
                 color: var(--dim); font: 600 12px system-ui, sans-serif; text-transform: uppercase; }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #tabs .count { margin-left: 4px; font-weight: 400; }
  /* The height keeps the swipe area under the finger on a short tab. */
  html.phone #board { display: block; min-height: calc(100vh - var(--tabs-h, 40px)); padding: 0 10px 40px; }
  html.phone .repo-head { position: static; padding: 14px 0 2px; }
  html.phone .cell { min-height: 0; padding: 0; border-right: 0; }
  html.phone .card { padding: 9px 10px; font-size: 14px; }
  html.phone .card .meta { font-size: 12px; }
  .empty-tab { padding: 30px 0; color: var(--dim); text-align: center; }
  html.phone #sheet.open { display: flex; position: fixed; inset: 0; z-index: 8; align-items: flex-end;
                           background: rgba(0, 0, 0, 0.5); }
  #sheet-panel { width: 100%; max-height: 88vh; overflow-y: auto; padding: 12px 14px 24px; background: var(--panel);
                 border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; font-size: 14px; }
  #sheet-panel .top { display: flex; align-items: flex-start; gap: 8px; }
  #sheet-panel h2 { flex: 1; margin: 0; font-size: 16px; word-break: break-all; }
  #sheet-panel .where { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #sheet-panel h3 { margin: 14px 0 6px; color: var(--dim); font-size: 11px; text-transform: uppercase; }
  #sheet-panel .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #sheet-panel .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; color: var(--dim); font-size: 12px; }
  #sheet-panel .waiting-on { margin-top: 6px; color: var(--warn); }
  #sheet-panel .error { margin-top: 6px; color: #f0b8bd; word-break: break-word; }
  #sheet-panel button, #confirm button { padding: 8px 12px; background: var(--card); color: var(--text);
                                          border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #sheet-panel button.current { border-color: var(--accent); color: var(--accent); }
  #sheet-panel button:disabled { opacity: 0.4; }
  #sheet-owner { flex: 1; min-width: 0; padding: 8px; background: var(--bg); color: var(--text);
                 border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #sheet-doc { margin: 0; padding: 8px; background: var(--bg); border-radius: 6px; white-space: pre-wrap;
               word-break: break-word; font: 12px/1.4 ui-monospace, monospace; }
  html.phone #confirm .phone-only { display: flex; gap: 8px; max-width: none; margin-top: 12px; padding: 0;
                                    background: none; border: 0; }
  html.phone #confirm .phone-only button { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>plans</h1>
  <div id="repo-picker">
    <input id="repo" type="text" role="combobox" aria-expanded="false" aria-controls="repo-list"
           aria-autocomplete="list" autocomplete="off" placeholder="all repos" title="repo (r)">
    <ul id="repo-list" role="listbox"></ul>
  </div>
  <input id="text" type="text" placeholder="/ filter id" autocomplete="off">
  <select id="owner" title="owner"></select>
  <select id="project" title="project"></select>
  <select id="status" title="status"></select>
  <select id="kind" title="kind"></select>
  <label><input id="waiting" type="checkbox"> waiting on owner</label>
  <span id="keys">j k cards, gg G ends, h l columns, H L status, J K rank, e owner, x cancel, o open, / filter, r repo</span>
</header>
<nav id="tabs"></nav>
<div id="board"></div>
<div id="sheet"><div id="sheet-panel"></div></div>
<div id="message"></div>
<div id="confirm"><div></div></div>
<script>
"use strict";

const ALL = "";
let board = null;
let selected_path = null;
const filters = { repo: ALL, text: "", owner: ALL, project: ALL, status: ALL, kind: ALL, waiting: false };
const element = (id) => document.getElementById(id);

function make(tag, class_name, text) {
  const node = document.createElement(tag);
  if (class_name) node.className = class_name;
  if (text !== undefined) node.textContent = text;
  return node;
}

function show_message(text, kind) {
  const box = element("message");
  box.textContent = text;
  box.className = kind || "";
  box.style.display = "block";
  clearTimeout(show_message.timer);
  show_message.timer = setTimeout(() => { box.style.display = "none"; }, 6000);
}

const WRITE_HEADERS = { "Content-Type": "application/json", "X-Plans-Board": "1" };
// A move into one of these asks first, because it takes the doc out of the work order.
const CONFIRM_STATUSES = ["blocked", "done"];
let pending_confirm = null;
// Set when a write lost the server. The event stream reloads the board when it reconnects, even on an unchanged version.
let server_lost = false;

// One write. A refusal (409 and the rest) names the reason, and the reload snaps the card back to the disk state.
async function write(action, body) {
  let response;
  try {
    response = await fetch(`/api/${action}`, { method: "POST", headers: WRITE_HEADERS, body: JSON.stringify(body) });
  } catch {
    // The connection can drop after the server wrote, so the message cannot say that the write failed.
    server_lost = true;
    show_message(`Server unreachable: the change to ${doc_name(body.path)} may have landed. The board reloads when the server is back.`);
    return false;
  }
  const answer = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
  if (response.status === 409 && answer.keys) {
    show_message(`Refused: ${doc_name(body.path)} changed since the board read it (${answer.keys.join(", ")}). Reloaded.`);
  } else if (answer.maybe_applied) {
    show_message(`The write failed partway and may have landed: ${answer.error}. Reloaded; check the card.`);
  } else if (!response.ok) {
    show_message(`Refused: ${answer.error}`);
  } else {
    const ids = (list) => (list || []).map((doc) => doc.id).join(", ");
    const notes = [];
    if (answer.skipped && answer.skipped.length) notes.push(`these changed meanwhile and kept their rank: ${ids(answer.skipped)}`);
    if (answer.uncertain && answer.uncertain.length) notes.push(`these failed to write and may have the new rank: ${ids(answer.uncertain)}`);
    const kept = (answer.results || []).filter((line) => line.startsWith("skipped:"));
    if (kept.length) show_message(`Cancelled ${doc_name(body.path)}, but ${kept.join("; ")}`);
    if (notes.length) show_message(`Renumbered, but ${notes.join("; ")}`);
  }
  if (action !== "open") await load_board();
  return response.ok;
}

function doc_by_path(path) {
  for (const repo of board.repos) {
    const doc = repo.docs.find((doc) => doc.path === path);
    if (doc) return doc;
  }
  return null;
}

function doc_name(path) {
  const doc = doc_by_path(path);
  return doc ? doc.id : path;
}

function ask(question, on_yes) {
  const box = element("confirm");
  box.firstElementChild.textContent = `${question}  y / n`;
  // The keys answer on a wide screen. A phone has no keyboard, so it gets buttons, which CSS hides elsewhere.
  const buttons = make("div", "phone-only");
  const yes = make("button", "", "Yes");
  const no = make("button", "", "No");
  yes.addEventListener("click", () => answer_confirm(true));
  no.addEventListener("click", () => answer_confirm(false));
  buttons.append(yes, no);
  box.firstElementChild.append(buttons);
  box.style.display = "flex";
  pending_confirm = on_yes;
}

function answer_confirm(yes) {
  const on_yes = pending_confirm;
  pending_confirm = null;
  element("confirm").style.display = "none";
  if (yes && on_yes) on_yes();
}

function set_status(doc, status) {
  const send = () => write("update", { path: doc.path, basis: { status: doc.status }, changes: { status } });
  if (CONFIRM_STATUSES.includes(status)) ask(`Move ${doc.id} to ${status}?`, send);
  else send();
}

// H and L step one status column, empty or not.
function shift_status(offset) {
  const doc = doc_by_path(selected_path);
  if (!doc) return;
  const status = board.statuses[board.statuses.indexOf(doc.status) + offset];
  if (status) set_status(doc, status);
}

// The docs of the target cell in rank order, without the moved doc, including the ones the filters hide.
// The server leaves docs without a whole-number rank out of its cell, so this does too.
function cell_docs_of(doc, status) {
  const repo = board.repos.find((repo) => repo.docs.includes(doc));
  return repo.docs.filter((other) => other.project === doc.project && other.status === status && other !== doc
    && Number.isInteger(other.rank));
}

// The neighbours of a drop at `index` among the shown cards of the cell. The server refuses the move unless the two
// are still next to each other in the full cell, so the neighbours come from the full cell: the shown card under the
// drop and the doc right before it, or the doc right after the last shown card.
function drop_request(doc, status, shown_cards, index) {
  const cell_docs = cell_docs_of(doc, status);
  let above, below;
  if (index < shown_cards.length) {
    below = doc_by_path(shown_cards[index].dataset.path);
    above = cell_docs[cell_docs.indexOf(below) - 1] || null;
  } else {
    above = index > 0 ? doc_by_path(shown_cards[index - 1].dataset.path) : null;
    below = cell_docs[above ? cell_docs.indexOf(above) + 1 : 0] || null;
  }
  return {
    path: doc.path, basis: { status: doc.status, rank: doc.rank }, status,
    above: above && above.path, below: below && below.path,
  };
}

function cell_cards(cell, without_path) {
  return [...cell.querySelectorAll(".card")].filter((card) => card.dataset.path !== without_path);
}

function move_confirmed(doc, status, request) {
  const send = () => write("move", request);
  if (status !== doc.status && CONFIRM_STATUSES.includes(status)) ask(`Move ${doc.id} to ${status}?`, send);
  else send();
}

// J and K swap the card with its neighbour in the cell, which changes only its rank.
function shift_rank(offset) {
  const doc = doc_by_path(selected_path);
  const card = selected_card();
  if (!doc || !card) return;
  const siblings = cell_cards(card.parentElement, null);
  const target = siblings.indexOf(card) + offset;
  if (target < 0 || target >= siblings.length) return;
  const others = cell_cards(card.parentElement, doc.path);
  write("move", drop_request(doc, doc.status, others, target));
}

function set_owner(doc, value) {
  if (value.trim() === doc.owner_session) return;
  // The shown session values go in the basis too, so a claim since the page loaded refuses the edit.
  const basis = { owner_session: doc.owner_session, owner_session_id: doc.owner_session_id, owner_session_pid: doc.owner_session_pid };
  write("update", { path: doc.path, basis, changes: { owner_session: value.trim() } });
}

function edit_owner() {
  const doc = doc_by_path(selected_path);
  const card = selected_card();
  if (!doc || !card) return;
  const input = make("input", "owner-input");
  // input.remove() fires blur, which calls close_input again on the input that is already leaving.
  let closed = false;
  const close_input = () => {
    if (closed) return;
    closed = true;
    input.remove();
    release_held_reload();
  };
  input.value = doc.owner_session;
  input.placeholder = "session name or none";
  card.append(input);
  input.focus();
  input.select();
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") set_owner(doc, input.value);
    if (event.key === "Enter" || event.key === "Escape") { event.stopPropagation(); close_input(); }
  });
  input.addEventListener("blur", close_input);
}

// An error card opens too, so the owner can fix the doc. A repo-level error card names the repo, not a doc.
function can_open(path) {
  return Boolean(doc_by_path(path))
    || board.repos.some((repo) => repo.problems.some((problem) => problem.path === path && path !== repo.root));
}

// The prompt lists every change from the server's preview. The apply request carries the same shown values, so a card
// that changed since the board loaded is refused.
async function cancel_card() {
  const doc = doc_by_path(selected_path);
  if (!doc) return;
  const basis = Object.fromEntries(["status", "owner_session", "owner_session_id", "owner_session_pid", "pr", "issue", "branch"].map((key) => [key, doc[key] ?? ""]));
  let answer;
  try {
    const response = await fetch("/api/cancel", { method: "POST", headers: WRITE_HEADERS, body: JSON.stringify({ path: doc.path, basis, apply: false }) });
    answer = await response.json();
    if (!response.ok) return show_message(`Refused: ${answer.error}`);
  } catch {
    return show_message("Could not read what cancel would change.");
  }
  const lines = [...answer.changes, ...answer.notes.map((note) => `(${note})`)];
  ask(`Cancel ${doc.id}? It will: ${lines.join("; ")}.`, () => write("cancel", { path: doc.path, basis, apply: true }));
}

function open_doc() {
  if (can_open(selected_path)) write("open", { path: selected_path });
}

// The owner badge, links and inputs keep their own double-click meaning, so they never open the editor.
function open_on_dblclick(card, path) {
  card.addEventListener("dblclick", (event) => {
    if (event.target.closest("a, .owner, input")) return;
    select_card(path);
    open_doc();
  });
}

// A render rebuilds every card, which would drop the owner's typing or the card under the pointer. A reload
// asked for meanwhile waits, and release_held_reload fetches the newest board once the input or the drag ends.
let held_reload = false;
let drag_in_progress = false;

function board_is_busy() {
  return drag_in_progress || Boolean(document.querySelector(".owner-input"));
}

function release_held_reload() {
  if (!held_reload) return;
  held_reload = false;
  load_board();
}

async function load_board() {
  if (board_is_busy()) { held_reload = true; return; }
  const response = await fetch("/api/board", { cache: "no-store" });
  const fresh = await response.json();
  // Two loads can finish out of order, and the older answer must not replace the newer board.
  if (board && fresh.version < board.version) return;
  if (board_is_busy()) { held_reload = true; return; }
  board = fresh;
  server_lost = false;
  fill_filter_choices();
  render();
}

function fill_select(id, label, values) {
  const select = element(id);
  const current = select.value;
  select.replaceChildren(new Option(label, ALL), ...values.map((value) => new Option(value, value)));
  select.value = values.includes(current) ? current : ALL;
  filters[id] = select.value;
}

function fill_filter_choices() {
  const docs = board.repos.flatMap((repo) => repo.docs);
  const distinct = (key) => [...new Set(docs.map((doc) => String(doc[key])))].sort();
  refresh_repo_choices();
  fill_select("owner", "any owner", distinct("owner_session"));
  fill_select("project", "any project", distinct("project"));
  fill_select("status", "any status", board.statuses.slice());
  fill_select("kind", "any kind", board.kinds.slice());
}

// Each filter select and the front matter key it compares.
const SELECT_FILTER_KEYS = { owner: "owner_session", project: "project", status: "status", kind: "kind" };

function doc_is_shown(doc) {
  const select_matches = Object.entries(SELECT_FILTER_KEYS)
    .every(([filter, key]) => filters[filter] === ALL || String(doc[key]) === filters[filter]);
  const text_matches = !filters.text || doc.id.includes(filters.text);
  return select_matches && text_matches && (!filters.waiting || Boolean(doc.waiting_on));
}

// An unreadable doc has no keys to filter on, so any select filter hides it, and the text filter matches its id.
function problem_is_shown(problem) {
  const select_filter_set = Object.keys(SELECT_FILTER_KEYS).some((filter) => filters[filter] !== ALL);
  return !select_filter_set && !filters.waiting && (!filters.text || problem.id.includes(filters.text));
}

function pr_link(repo, pr) {
  if (pr === null || pr === undefined || pr === "none" || pr === "") return null;
  const text = String(pr);
  if (/^https?:\/\//.test(text)) return { href: text, label: "PR" };
  const number = text.replace(/^#/, "");
  if (/^[0-9]+$/.test(number) && repo.web_url) return { href: `${repo.web_url}/pull/${number}`, label: `#${number}` };
  return { href: null, label: `PR ${text}` };
}

function card_node(repo, doc) {
  const card = make("div", "card");
  card.dataset.path = doc.path;
  card.dataset.status = doc.status;
  if (doc.waiting_on) card.classList.add("waiting");
  card.append(make("div", "id", doc.id));
  const meta = make("div", "meta");
  meta.append(make("span", "badge", doc.kind), make("span", "badge owner", doc.owner_session),
              make("span", "badge", `rank ${doc.rank}`));
  const link = pr_link(repo, doc.pr);
  if (link) {
    const node = link.href ? make("a", "badge", link.label) : make("span", "badge", link.label);
    if (link.href) { node.href = link.href; node.target = "_blank"; node.rel = "noopener"; }
    meta.append(node);
  }
  for (const dependency of doc.depends_on || []) meta.append(make("span", "badge depends", `after ${dependency}`));
  card.append(meta);
  if (doc.waiting_on) card.append(make("div", "waiting-on", `waiting: ${doc.waiting_on}`));
  if (is_phone()) {
    card.addEventListener("click", (event) => { if (!event.target.closest("a")) open_sheet(doc.path); });
    return card;
  }
  card.addEventListener("click", () => select_card(doc.path));
  open_on_dblclick(card, doc.path);
  card.querySelector(".owner").addEventListener("click", () => { select_card(doc.path); edit_owner(); });
  card.querySelector(".owner").title = "click or e: change the owner";
  card.addEventListener("pointerdown", (event) => start_drag(event, card, doc));
  return card;
}

function problem_node(problem) {
  const card = make("div", "card problem");
  card.dataset.path = problem.path;
  card.append(make("div", "id", problem.id), make("div", "error", problem.error));
  if (is_phone()) {
    card.addEventListener("click", () => open_sheet(problem.path));
    return card;
  }
  card.addEventListener("click", () => select_card(problem.path));
  open_on_dblclick(card, problem.path);
  return card;
}

function lane_cells(container, statuses, lane_key) {
  const cells = {};
  for (const status of statuses) {
    const cell = make("div", "cell");
    cell.dataset.status = status;
    cell.dataset.lane = lane_key;
    container.append(cell);
    cells[status] = cell;
  }
  return cells;
}

function measure_heads() {
  const root = document.documentElement.style;
  root.setProperty("--header-h", `${document.querySelector("header").getBoundingClientRect().height}px`);
  const row = element("column-row");
  if (row) root.setProperty("--column-row-h", `${row.getBoundingClientRect().height}px`);
  const repo_head = document.querySelector(".repo-head");
  if (repo_head) root.setProperty("--repo-head-h", `${repo_head.getBoundingClientRect().height}px`);
}
const row_observer = new ResizeObserver(measure_heads);
new ResizeObserver(measure_heads).observe(document.querySelector("header"));

function render() {
  if (is_phone()) return render_phone();
  const container = element("board");
  const statuses = board.statuses;
  container.style.gridTemplateColumns = `repeat(${statuses.length}, minmax(150px, 1fr))`;
  const column_row = make("div");
  column_row.id = "column-row";
  column_row.append(...statuses.map((status) => make("div", "column-head", status)));
  container.replaceChildren(column_row);
  row_observer.disconnect();
  row_observer.observe(column_row);
  measure_heads();
  for (const repo of board.repos) {
    if (filters.repo !== ALL && repo.root !== filters.repo) continue;
    const docs = repo.docs.filter(doc_is_shown);
    if (!docs.length && !repo.problems.some(problem_is_shown)) continue;
    const section = make("div", "repo-section");
    container.append(section);
    section.append(make("div", "repo-head", repo.label));
    const problems = repo.problems.filter(problem_is_shown);
    if (problems.length) {
      section.append(make("div", "lane-head", "unreadable"));
      const cells = lane_cells(section, statuses, `${repo.root}\n`);
      for (const problem of problems) cells[problem.status || statuses[0]].append(problem_node(problem));
    }
    const projects = [...new Set(docs.map((doc) => doc.project))].sort();
    for (const project of projects) {
      section.append(make("div", "lane-head", project));
      const cells = lane_cells(section, statuses, `${repo.root}\n${project}`);
      for (const doc of docs.filter((doc) => doc.project === project)) {
        cells[statuses.includes(doc.status) ? doc.status : statuses[0]].append(card_node(repo, doc));
      }
    }
  }
  const cards = all_cards();
  if (!cards.some((card) => card.dataset.path === selected_path)) selected_path = cards.length ? cards[0].dataset.path : null;
  mark_selected();
  measure_heads();
}

function all_cards() { return [...document.querySelectorAll("#board .card")]; }
function selected_card() { return all_cards().find((card) => card.dataset.path === selected_path) || null; }

// edge is "top" or "bottom" to scroll the window fully, past the sticky bars and the repo and lane titles that
// "nearest" leaves hidden.
function select_card(path, edge) {
  selected_path = path;
  mark_selected();
  const card = selected_card();
  if (!card) return;
  if (!edge) {
    card.scrollIntoView({ block: "nearest", inline: "nearest" });
    return;
  }
  window.scrollTo({ top: edge === "top" ? 0 : document.documentElement.scrollHeight });
  // The column's end card can sit in a lane far from the page end. Keep it in view rather than lose the selection.
  // The window also scrolls sideways when the columns do not fit, so reveal the card's column as "nearest" does.
  const view_width = document.documentElement.clientWidth;
  const side = card.getBoundingClientRect();
  if (side.left < 0) window.scrollBy({ left: side.left });
  else if (side.right > view_width) window.scrollBy({ left: Math.min(side.right - view_width, side.left) });
  const rect = card.getBoundingClientRect();
  const repo_head = card.closest(".repo-section").querySelector(".repo-head");
  const sticky_bottom = document.querySelector(".column-head").getBoundingClientRect().bottom + repo_head.getBoundingClientRect().height;
  const view_bottom = document.documentElement.clientHeight;
  if (rect.top >= sticky_bottom && rect.bottom <= view_bottom) return;
  window.scrollBy({ top: edge === "top" ? rect.top - sticky_bottom : rect.bottom - view_bottom });
}

function mark_selected() {
  for (const card of all_cards()) card.classList.toggle("selected", card.dataset.path === selected_path);
}

function column_index(card) { return board.statuses.indexOf(card.parentElement.dataset.status); }

// j and k walk one column top to bottom across every lane, so they never jump sideways.
function step_in_column(offset) {
  const card = selected_card();
  if (!card) return;
  const column = all_cards().filter((other) => column_index(other) === column_index(card));
  const target = column[column.indexOf(card) + offset] || card;
  const at_end = target === column[offset < 0 ? 0 : column.length - 1];
  select_card(target.dataset.path, at_end ? (offset < 0 ? "top" : "bottom") : undefined);
}

// gg and G pick the first or last card of the current column. With no selection they use the first column that has cards.
function jump_in_column(last) {
  const cards = all_cards();
  const card = selected_card() || cards[0];
  if (!card) return;
  const column = cards.filter((other) => column_index(other) === column_index(card));
  select_card(column[last ? column.length - 1 : 0].dataset.path, last ? "bottom" : "top");
}

// h and l go to the nearest column that has cards, and there to the card closest in height to the current one.
function step_column(offset) {
  const card = selected_card();
  if (!card) return;
  const top = card.getBoundingClientRect().top;
  for (let column = column_index(card) + offset; column >= 0 && column < board.statuses.length; column += offset) {
    const candidates = all_cards().filter((other) => column_index(other) === column);
    if (!candidates.length) continue;
    const distance = (other) => Math.abs(other.getBoundingClientRect().top - top);
    candidates.sort((a, b) => distance(a) - distance(b));
    select_card(candidates[0].dataset.path);
    return;
  }
}

// The phone layout. Below PHONE_MAX_WIDTH the board shows one status at a time, with a tab per status and a swipe to
// the next or previous one. A tap on a card opens a sheet with its actions and the doc text. The sheet writes through
// write(), as the keys do, so it gets the same refusals. It has no cancel and no editor: the server refuses both from
// the phone.
const PHONE_MAX_WIDTH = 600;
const SWIPE_MIN_PX = 60;
const DEFAULT_TAB = "building";
const phone_query = matchMedia(`(max-width: ${PHONE_MAX_WIDTH}px)`);
let phone_status = null;
let sheet_path = null;

function is_phone() { return phone_query.matches; }

function apply_layout() {
  document.documentElement.classList.toggle("phone", is_phone());
  element("board").style.gridTemplateColumns = "";
  // The tabs replace the status filter, which the phone hides.
  if (is_phone() && filters.status !== ALL) { filters.status = ALL; element("status").value = ALL; }
  if (!is_phone()) close_sheet();
  if (board) render();
}

function shown_status(doc) { return board.statuses.includes(doc.status) ? doc.status : board.statuses[0]; }

function render_phone() {
  const statuses = board.statuses;
  const repos = board.repos.filter((repo) => filters.repo === ALL || repo.root === filters.repo).map((repo) => ({
    repo, docs: repo.docs.filter(doc_is_shown), problems: repo.problems.filter(problem_is_shown),
  }));
  const counts = Object.fromEntries(statuses.map((status) => [status, 0]));
  for (const { docs, problems } of repos) {
    for (const item of [...docs, ...problems]) counts[shown_status(item)] += 1;
  }
  // The tab follows the card in the sheet, so a status change keeps it in view behind the sheet.
  const sheet_doc = sheet_path && doc_by_path(sheet_path);
  if (sheet_doc) phone_status = shown_status(sheet_doc);
  // The first visit opens on the work in flight, else on the first status that has cards.
  if (!statuses.includes(phone_status)) {
    phone_status = counts[DEFAULT_TAB] ? DEFAULT_TAB : statuses.find((status) => counts[status]) || statuses[0];
  }
  render_tabs(counts);
  const container = element("board");
  container.replaceChildren();
  for (const { repo, docs, problems } of repos) {
    const tab_docs = docs.filter((doc) => shown_status(doc) === phone_status);
    const tab_problems = problems.filter((problem) => shown_status(problem) === phone_status);
    if (!tab_docs.length && !tab_problems.length) continue;
    const section = make("div", "repo-section");
    container.append(section);
    section.append(make("div", "repo-head", repo.label));
    if (tab_problems.length) {
      section.append(make("div", "lane-head", "unreadable"));
      lane_cells(section, [phone_status], `${repo.root}\n`)[phone_status].append(...tab_problems.map(problem_node));
    }
    for (const project of [...new Set(tab_docs.map((doc) => doc.project))].sort()) {
      section.append(make("div", "lane-head", project));
      const cell = lane_cells(section, [phone_status], `${repo.root}\n${project}`)[phone_status];
      cell.append(...tab_docs.filter((doc) => doc.project === project).map((doc) => card_node(repo, doc)));
    }
  }
  if (!container.children.length) container.append(make("div", "empty-tab", `No cards in ${phone_status}.`));
  if (sheet_path) refresh_sheet();
}

function render_tabs(counts) {
  const tabs = element("tabs");
  tabs.replaceChildren(...board.statuses.map((status) => {
    const tab = make("button", status === phone_status ? "active" : "", status);
    tab.append(make("span", "count", String(counts[status])));
    tab.addEventListener("click", () => show_tab(status));
    return tab;
  }));
  document.documentElement.style.setProperty("--tabs-h", `${tabs.getBoundingClientRect().height}px`);
  tabs.querySelector(".active")?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function show_tab(status) {
  if (!status || status === phone_status) return;
  phone_status = status;
  render();
  window.scrollTo({ top: 0 });
}

let swipe_start = null;
element("board").addEventListener("touchstart", (event) => {
  swipe_start = event.touches.length === 1 ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
}, { passive: true });
element("board").addEventListener("touchend", (event) => {
  if (!swipe_start || !is_phone()) return;
  const dx = event.changedTouches[0].clientX - swipe_start.x;
  const dy = event.changedTouches[0].clientY - swipe_start.y;
  swipe_start = null;
  // A mostly sideways stroke flips the tab. Anything steeper is a scroll.
  if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const statuses = board.statuses;
  show_tab(statuses[statuses.indexOf(phone_status) + (dx < 0 ? 1 : -1)]);
}, { passive: true });

function problem_by_path(path) {
  for (const repo of board.repos) {
    const problem = repo.problems.find((problem) => problem.path === path && path !== repo.root);
    if (problem) return problem;
  }
  return null;
}

function open_sheet(path) {
  sheet_path = path;
  select_card(path);
  element("sheet").classList.add("open");
  build_sheet();
  refresh_sheet();
}

function close_sheet() {
  sheet_path = null;
  element("sheet").classList.remove("open");
}

element("sheet").addEventListener("click", (event) => { if (event.target === element("sheet")) close_sheet(); });

// The sheet is built once per card and then updated in place on each board load, so a reload never drops the owner
// field's typing or the button under the finger.
function build_sheet() {
  const panel = element("sheet-panel");
  const close = make("button", "", "Close");
  close.addEventListener("click", close_sheet);
  const top = make("div", "top");
  const title = make("div");
  title.style.flex = "1";
  title.append(make("h2", "sheet-id"), make("div", "where"));
  top.append(title, close);
  panel.replaceChildren(top, make("div", "meta-slot"));
  if (doc_by_path(sheet_path)) {
    const statuses = make("div", "row statuses");
    for (const status of board.statuses) {
      const button = make("button", "", status);
      button.dataset.status = status;
      button.addEventListener("click", () => {
        const doc = doc_by_path(sheet_path);
        if (doc && doc.status !== status) set_status(doc, status);
      });
      statuses.append(button);
    }
    const ranks = make("div", "row");
    const up = make("button", "rank-up", "Up");
    const down = make("button", "rank-down", "Down");
    up.addEventListener("click", () => shift_rank(-1));
    down.addEventListener("click", () => shift_rank(1));
    ranks.append(up, down, make("span", "where rank-note"));
    const owner = make("div", "row");
    const input = make("input");
    input.id = "sheet-owner";
    input.placeholder = "session name or none";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    const save = make("button", "", "Set");
    const free = make("button", "", "None");
    const send = (value) => { const doc = doc_by_path(sheet_path); if (doc) set_owner(doc, value); };
    save.addEventListener("click", () => send(input.value));
    free.addEventListener("click", () => send("none"));
    input.addEventListener("keydown", (event) => {
      event.stopPropagation();
      if (event.key === "Enter") { send(input.value); input.blur(); }
    });
    owner.append(input, save, free);
    panel.append(make("h3", "", "Status"), statuses, make("h3", "", "Rank"), ranks, make("h3", "", "Owner"), owner);
  }
  const doc_text = make("pre", "", "Loading...");
  doc_text.id = "sheet-doc";
  panel.append(make("h3", "", "Doc"), doc_text);
  panel.scrollTop = 0;
}

function refresh_sheet() {
  const doc = doc_by_path(sheet_path);
  const problem = doc ? null : problem_by_path(sheet_path);
  if (!doc && !problem) return close_sheet();
  const panel = element("sheet-panel");
  const repo = board.repos.find((repo) => (doc ? repo.docs.includes(doc) : repo.problems.includes(problem)));
  panel.querySelector(".sheet-id").textContent = (doc || problem).id;
  panel.querySelector(".where").textContent = doc ? `${repo.label} / ${doc.project}` : repo.label;
  const slot = panel.querySelector(".meta-slot");
  if (doc) {
    // The card's own badges and waiting line, without its handlers.
    const card = card_node(repo, doc);
    slot.replaceChildren(...[...card.children].filter((node) => !node.classList.contains("id")));
    for (const button of panel.querySelectorAll(".statuses button")) {
      button.classList.toggle("current", button.dataset.status === doc.status);
    }
    const card_in_tab = selected_card();
    const siblings = card_in_tab ? cell_cards(card_in_tab.parentElement, null) : [];
    const place = siblings.indexOf(card_in_tab);
    panel.querySelector(".rank-up").disabled = place <= 0;
    panel.querySelector(".rank-down").disabled = place < 0 || place >= siblings.length - 1;
    panel.querySelector(".rank-note").textContent = `rank ${doc.rank}`;
    const input = element("sheet-owner");
    // A value the owner is typing stays. Only an untouched field follows the board.
    if (input.value === (input.dataset.shown ?? "")) input.value = doc.owner_session;
    input.dataset.shown = doc.owner_session;
  } else {
    slot.replaceChildren(make("div", "error", problem.error));
  }
  load_sheet_doc(sheet_path);
}

async function load_sheet_doc(path) {
  let text;
  try {
    const response = await fetch(`/api/doc?path=${encodeURIComponent(path)}`, { cache: "no-store" });
    const answer = await response.json();
    text = response.ok ? answer.text : `Cannot read the doc: ${answer.error}`;
  } catch {
    text = "Cannot reach the server.";
  }
  // The sheet can have moved to another card while the request ran.
  if (path === sheet_path) element("sheet-doc").textContent = text;
}

phone_query.addEventListener("change", apply_layout);

// fuzzy:start
// Subsequence match, case-insensitive. Higher is better, -Infinity is no match. A late hit in a long name can score below zero and still match. A consecutive run and a hit at a word start
// score extra, a gap costs a little, and a shorter text wins a tie.
function fuzzy_score(query, text) {
  query = query.toLowerCase();
  text = text.toLowerCase();
  let score = 0;
  let at = 0;
  let run = 0;
  for (const character of query) {
    const found = text.indexOf(character, at);
    if (found < 0) return -Infinity;
    run = found === at ? run + 1 : 0;
    const at_boundary = found === 0 || "/-_. ".includes(text[found - 1]);
    score += 1 + run * 2 + (at_boundary ? 3 : 0) - (found - at) * 0.1;
    at = found + 1;
  }
  return score - text.length * 0.01;
}

// A repo matches on its owner/name label or its folder name. The folder gets a small bonus so a typed folder name
// finds its repo first. The result keeps the input order among equal scores, so a sorted input stays A to Z.
function rank_repos(query, repos) {
  if (!query) return repos.slice();
  const scored = [];
  for (const repo of repos) {
    const folder = repo.root.split("/").filter(Boolean).pop() || "";
    const folder_score = fuzzy_score(query, folder);
    const best = Math.max(fuzzy_score(query, repo.label), folder_score + 2);
    if (best > -Infinity) scored.push({ repo, best });
  }
  return scored.map((entry, index) => ({ ...entry, index }))
    .sort((a, b) => b.best - a.best || a.index - b.index)
    .map((entry) => entry.repo);
}
// fuzzy:end

// The repo picker is a combobox. A repo with no plan docs and no unreadable docs has nothing to show, so it is
// not listed. The row with root ALL stands for all repos.
let repo_choices = [];
let repo_list_open = false;
let repo_query_typed = false;
let repo_active_root = null;

function repo_label_for(root) {
  const repo = repo_choices.find((choice) => choice.root === root);
  return repo ? repo.label : "";
}

function repo_rows() {
  const query = repo_query_typed ? element("repo").value.trim() : "";
  const matches = rank_repos(query, repo_choices);
  return query ? matches : [{ root: ALL, label: "all repos" }, ...matches];
}

function render_repo_list() {
  const list = element("repo-list");
  const input = element("repo");
  const rows = repo_rows();
  if (!rows.some((row) => row.root === repo_active_root)) repo_active_root = rows.length ? rows[0].root : null;
  list.classList.toggle("open", repo_list_open);
  input.setAttribute("aria-expanded", String(repo_list_open));
  input.removeAttribute("aria-activedescendant");
  if (!repo_list_open) return;
  const items = rows.map((row, index) => {
    const item = make("li", "", row.label);
    item.id = `repo-option-${index}`;
    item.setAttribute("role", "option");
    item.dataset.root = row.root;
    const is_active = row.root === repo_active_root;
    item.setAttribute("aria-selected", String(is_active));
    item.classList.toggle("active", is_active);
    item.classList.toggle("chosen", row.root === filters.repo);
    if (is_active) input.setAttribute("aria-activedescendant", item.id);
    return item;
  });
  if (!items.length) {
    const none = make("li", "none", "no repo matches");
    none.setAttribute("role", "option");
    none.setAttribute("aria-disabled", "true");
    items.push(none);
  }
  list.replaceChildren(...items);
  list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
}

function open_repo_list() {
  repo_list_open = true;
  render_repo_list();
}

function close_repo_list() {
  repo_list_open = false;
  repo_query_typed = false;
  repo_active_root = filters.repo;
  element("repo").value = repo_label_for(filters.repo);
  render_repo_list();
}

function pick_repo(root) {
  filters.repo = root;
  close_repo_list();
  element("repo").blur();
  render();
}

// Runs on every board load. It never writes the box text while the box has focus, so a reload does not wipe what
// the owner is typing, close the list or move the highlight. A pick whose repo lost its docs falls back to all
// repos.
function refresh_repo_choices() {
  repo_choices = board.repos.filter((repo) => repo.docs.length || repo.problems.length);
  if (filters.repo !== ALL && !repo_choices.some((repo) => repo.root === filters.repo)) filters.repo = ALL;
  if (document.activeElement !== element("repo")) element("repo").value = repo_label_for(filters.repo);
  render_repo_list();
}

function move_repo_highlight(offset) {
  const rows = repo_rows();
  if (!rows.length) return;
  const current = rows.findIndex((row) => row.root === repo_active_root);
  repo_active_root = rows[(current + offset + rows.length) % rows.length].root;
  render_repo_list();
}

const REPO_KEYS = {
  ArrowDown: () => { if (!repo_list_open) open_repo_list(); else move_repo_highlight(1); },
  ArrowUp: () => { if (!repo_list_open) open_repo_list(); else move_repo_highlight(-1); },
  Enter: () => {
    if (!repo_list_open) return open_repo_list();
    if (repo_rows().some((row) => row.root === repo_active_root)) pick_repo(repo_active_root);
  },
  Escape: (event) => {
    if (element("repo").value === "") return pick_repo(ALL);
    if (!repo_list_open) return;
    event.stopPropagation();
    close_repo_list();
  },
};

element("repo").addEventListener("keydown", (event) => {
  const action = REPO_KEYS[event.key];
  if (!action || event.ctrlKey || event.metaKey || event.altKey) return;
  event.preventDefault();
  action(event);
});
element("repo").addEventListener("focus", (event) => {
  event.target.select();
  repo_active_root = filters.repo;
  open_repo_list();
});
element("repo").addEventListener("click", () => { if (!repo_list_open) open_repo_list(); });
element("repo").addEventListener("input", () => {
  repo_query_typed = true;
  repo_active_root = null;
  open_repo_list();
});
element("repo").addEventListener("blur", close_repo_list);
// mousedown rather than click: the blur that a click causes would close the list before the click lands.
element("repo-list").addEventListener("mousedown", (event) => {
  event.preventDefault();
  const item = event.target.closest("li[data-root]");
  if (item) pick_repo(item.dataset.root);
});

// Drag by pointer events rather than HTML drag and drop: the card can only land in its own lane, and the marker
// shows the slot the drop takes.
const DRAG_THRESHOLD_PX = 4;

function start_drag(event, card, doc) {
  if (event.button !== 0 || event.target.closest("a, input")) return;
  const lane = card.parentElement.dataset.lane;
  const origin = { x: event.clientX, y: event.clientY };
  let dragging = false;
  let target = null;
  const marker = make("div", "drop-marker");

  const slot_at = (x, y) => {
    const cell = document.elementsFromPoint(x, y).find((node) => node.classList.contains("cell"));
    if (!cell || cell.dataset.lane !== lane) return null;
    const cards = cell_cards(cell, doc.path);
    const index = cards.filter((other) => {
      const box = other.getBoundingClientRect();
      return box.top + box.height / 2 < y;
    }).length;
    return { cell, cards, index };
  };

  const on_move = (move) => {
    if (!dragging && Math.hypot(move.clientX - origin.x, move.clientY - origin.y) < DRAG_THRESHOLD_PX) return;
    dragging = true;
    drag_in_progress = true;
    card.classList.add("dragging");
    card.style.transform = `translate(${move.clientX - origin.x}px, ${move.clientY - origin.y}px)`;
    target = slot_at(move.clientX, move.clientY);
    marker.remove();
    if (target) target.cell.insertBefore(marker, target.cards[target.index] || null);
  };

  // Only pointerup drops. A cancelled pointer, a window that loses focus or Escape ends the drag where it began, so
  // a held reload never waits on a drag that cannot finish.
  const end_drag = (drop) => {
    document.removeEventListener("pointermove", on_move);
    document.removeEventListener("pointerup", on_up);
    document.removeEventListener("pointercancel", on_cancel);
    document.removeEventListener("keydown", on_escape, true);
    window.removeEventListener("blur", on_cancel);
    marker.remove();
    card.classList.remove("dragging");
    card.style.transform = "";
    drag_in_progress = false;
    if (drop && dragging && target) {
      const status = target.cell.dataset.status;
      move_confirmed(doc, status, drop_request(doc, status, target.cards, target.index));
    }
    release_held_reload();
  };
  const on_up = () => end_drag(true);
  const on_cancel = () => end_drag(false);
  const on_escape = (key) => {
    if (key.key !== "Escape") return;
    key.stopPropagation();
    end_drag(false);
  };

  document.addEventListener("pointermove", on_move);
  document.addEventListener("pointerup", on_up);
  document.addEventListener("pointercancel", on_cancel);
  document.addEventListener("keydown", on_escape, true);
  window.addEventListener("blur", on_cancel);
}

function typing_in_field(event) {
  return ["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName);
}

// A first g arms the chord for a moment. Any other key disarms it and then acts as usual, so a lone g swallows nothing.
const CHORD_MS = 700;
let g_armed_until = 0;

const KEYS = {
  G: () => jump_in_column(true),
  j: () => step_in_column(1),
  k: () => step_in_column(-1),
  h: () => step_column(-1),
  l: () => step_column(1),
  r: () => element("repo").focus(),
  "/": () => element("text").focus(),
  H: () => shift_status(-1),
  L: () => shift_status(1),
  J: () => shift_rank(1),
  K: () => shift_rank(-1),
  e: () => edit_owner(),
  x: () => cancel_card(),
  o: () => open_doc(),
  Enter: () => open_doc(),
};

document.addEventListener("keydown", (event) => {
  if (pending_confirm) {
    event.preventDefault();
    if (["y", "n", "Escape"].includes(event.key)) answer_confirm(event.key === "y");
    return;
  }
  if (event.key === "Escape") {
    if (typing_in_field(event)) event.target.blur();
    else if (sheet_path) close_sheet();
    return;
  }
  if (typing_in_field(event) || event.ctrlKey || event.metaKey || event.altKey) return;
  // Holding g auto-repeats within the chord window and must not count as a second press.
  if (event.key === "g" && event.repeat) {
    event.preventDefault();
    return;
  }
  const chord_armed = Date.now() < g_armed_until;
  g_armed_until = 0;
  if (event.key === "g") {
    event.preventDefault();
    if (chord_armed) jump_in_column(false);
    else g_armed_until = Date.now() + CHORD_MS;
    return;
  }
  const action = KEYS[event.key];
  if (!action) return;
  event.preventDefault();
  action();
});

// A select or checkbox gives focus back after a pick, so the vim keys work again at once. The text filter keeps its
// focus until Enter or Escape.
for (const id of ["owner", "project", "status", "kind"]) {
  element(id).addEventListener("change", () => { filters[id] = element(id).value; element(id).blur(); render(); });
}
element("text").addEventListener("input", () => { filters.text = element("text").value; render(); });
element("text").addEventListener("keydown", (event) => { if (event.key === "Enter") event.target.blur(); });
element("waiting").addEventListener("change", () => {
  filters.waiting = element("waiting").checked;
  element("waiting").blur();
  render();
});

apply_layout();

// The server sends the board version at connect and after each change on disk. EventSource reconnects by itself.
const events = new EventSource("/api/events");
events.addEventListener("version", (event) => {
  if (!board || server_lost || Number(event.data) !== board.version) load_board();
});
</script>
</body>
