      } else {
        const number = tag === "ol" ? parseInt(item[2], 10) : 1;
        out.push(number === 1 ? `<${tag}>` : `<${tag} start="${number}">`);
        lists.push({ indent, tag });
      }
      const task = MD_TASK.exec(item[3]);
      if (task) {
        const checked = task[1] === " " ? "" : " checked";
        if (options.editable) {
          // The marker is left out of the key, as the server leaves it out of its match.
          const key = line.replace(MD_TASK_MARK, "$1 ");
          const nth = task_counts.get(key) || 0;
          task_counts.set(key, nth + 1);
          out.push(`<li class="task" data-line="${escape_html(line)}" data-nth="${nth}"><input type="checkbox"${checked}> ${inline(task[2])}`);
        } else {
          out.push(`<li class="task"><input type="checkbox" disabled${checked}> ${inline(task[2])}`);
        }
      } else {
        out.push(`<li>${inline(item[3])}`);
      }
      continue;
    }
    // An indented line continues the list item above it.
    if (lists.length && /^\s/.test(line) && !paragraph.length) {
      out.push(`\n${inline(line.trim())}`);
      continue;
    }
    if (lists.length) close_lists(-1);
    paragraph.push(line);
  }
  end_block();
  return out.join("\n");
}
// markdown:end

// A filter combobox: type to fuzzy-narrow the list, Up/Down move, Enter picks, Esc closes (or clears on an empty box),
// a click picks. Choices are {value, label}. The row with value ALL stands for "no filter" and comes first until the
// owner types. Each instance keeps its own open, typed and highlight state, and writes its pick to filters[id].
// The optional hooks let a box that is not a filter reuse the list: get_value reads the chosen value, first_row is the
// row that stands for "no pick", on_pick takes over the pick (so filters stay untouched), on_highlight and on_close
// serve a live preview, and clear_on_escape false makes Escape on an empty box close instead of picking first_row.
// Without them a box behaves as a filter.
const combos = {};

function make_combo({ id, all_label, none_label, get_choices_rank, get_value = () => filters[id],
                      first_row = { value: ALL, label: all_label }, on_pick = null, on_highlight = null,
                      on_close = null, clear_on_escape = true }) {
  const input = element(id);
  const list = element(`${id}-list`);
  const combo = { choices: [], list_open: false, query_typed: false, active_value: null };

  const label_for = (value) => combo.choices.find((choice) => choice.value === value)?.label ?? "";
  // The empty box means ALL, so the placeholder carries the "all" wording instead of text that would need clearing.
  const picked_text = () => (get_value() === first_row.value ? "" : label_for(get_value()));

  function rows() {
    const query = combo.query_typed ? input.value.trim() : "";
    const matches = get_choices_rank(query, combo.choices);
    return query ? matches : [first_row, ...matches];
  }

  function render_list() {
    const shown = rows();
    if (!shown.some((row) => row.value === combo.active_value)) combo.active_value = shown.length ? shown[0].value : null;
    list.classList.toggle("open", combo.list_open);
    input.setAttribute("aria-expanded", String(combo.list_open));
    input.removeAttribute("aria-activedescendant");
    if (!combo.list_open) return;
    if (on_highlight) on_highlight(combo.active_value);
    const items = shown.map((row, index) => {
      const item = make("li", "", row.label);
      const dot_color = id === "owner" ? owner_color_var(row.value) : "";
      if (dot_color) {
        const dot = make("span", "owner-dot");
        dot.style.background = dot_color;
        item.prepend(dot);
      }
      item.id = `${id}-option-${index}`;
      item.setAttribute("role", "option");
      item.dataset.value = row.value;
      const is_active = row.value === combo.active_value;
      item.setAttribute("aria-selected", String(is_active));
      item.classList.toggle("active", is_active);
      item.classList.toggle("chosen", row.value === get_value());
      if (is_active) input.setAttribute("aria-activedescendant", item.id);
      return item;
    });
    if (!items.length) {
      const none = make("li", "none", none_label);
      none.setAttribute("role", "option");
      none.setAttribute("aria-disabled", "true");
      items.push(none);
    }
    list.replaceChildren(...items);
    list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
  }

  function open_list() {
    combo.list_open = true;
    render_list();
  }

  function close_list() {
    combo.list_open = false;
    combo.query_typed = false;
    combo.active_value = get_value();
    input.value = picked_text();
    render_list();
    if (on_close) on_close();
  }

  function pick(value) {
    if (on_pick) {
      on_pick(value);
      close_list();
      input.blur();
      return;
    }
    // A project or session pick is a per-repo habit, so a new repo starts it at ALL even if the old value has cards there.
    if (id === "repo" && value !== ALL && value !== filters.repo) {
      if (!keeps_owner_on_repo_switch(filters.owner)) combos.owner.reset();
      combos.project.reset();
    }
    filters[id] = value;
    close_list();
    input.blur();
    fill_filter_choices();
    render();
  }

  function move_highlight(offset) {
    const shown = rows();
    if (!shown.length) return;
    const current = shown.findIndex((row) => row.value === combo.active_value);
    combo.active_value = shown[(current + offset + shown.length) % shown.length].value;
    render_list();
  }

  const KEYS = {
    ArrowDown: () => { if (!combo.list_open) open_list(); else move_highlight(1); },
    ArrowUp: () => { if (!combo.list_open) open_list(); else move_highlight(-1); },
    Enter: () => {
      if (!combo.list_open) return open_list();
      if (rows().some((row) => row.value === combo.active_value)) pick(combo.active_value);
    },
    Escape: (event) => {
      if (input.value === "" && clear_on_escape) return pick(first_row.value);
      if (!combo.list_open) return;
      event.stopPropagation();
      close_list();
    },
  };

  input.addEventListener("keydown", (event) => {
    const action = KEYS[event.key];
    if (!action || event.ctrlKey || event.metaKey || event.altKey) return;
    event.preventDefault();
    action(event);
  });
  input.addEventListener("focus", () => {
    input.select();
    combo.active_value = get_value();
    open_list();
  });
  input.addEventListener("click", () => { if (!combo.list_open) open_list(); });
  input.addEventListener("input", () => {
    combo.query_typed = true;
    combo.active_value = null;
    open_list();
  });
  input.addEventListener("blur", close_list);
  // mousedown rather than click: the blur that a click causes would close the list before the click lands.
  list.addEventListener("mousedown", (event) => {
    event.preventDefault();
    const item = event.target.closest("li[data-value]");
    if (item) pick(item.dataset.value);
  });

  // Runs on every board load. It never writes the box text while the box has focus, so a reload does not wipe what
  // the owner is typing, close the list or move the highlight. A pick that left the choices falls back to ALL.
  combo.set_choices = (choices) => {
    combo.choices = choices;
    if (!on_pick && filters[id] !== ALL && !choices.some((choice) => choice.value === filters[id])) filters[id] = ALL;
    if (document.activeElement !== input) input.value = picked_text();
    render_list();
  };
  combo.reset = () => {
    filters[id] = ALL;
    close_list();
  };
  combos[id] = combo;
  return combo;
}

// A repo with no plan docs and no unreadable docs has nothing to show, so it is not listed.
make_combo({ id: "repo", all_label: "all repos", none_label: "no repo matches", get_choices_rank: rank_repos });
for (const name of ["owner", "project", "status", "kind"]) {
  make_combo({ id: name, all_label: `any ${name}`, none_label: `no ${name} matches`, get_choices_rank: rank_choices });
}

// The Settings modal. Its theme box is a combo that previews on highlight and saves only on a pick.
const settings_box = element("settings");
make_combo({
  id: "theme", all_label: "Follow desktop", none_label: "no theme matches", get_choices_rank: rank_choices,
  get_value: chosen_theme, first_row: { value: FOLLOW, label: "Follow desktop" },
  on_pick: (value) => { set_theme(value); close_settings(); },
  on_highlight: (value) => preview_theme(value),
  on_close: end_preview, clear_on_escape: false,
});
combos.theme.set_choices(THEMES.map(([value, label]) => ({ value, label })));

function open_settings() {
  close_help();
  settings_open = true;
  settings_box.classList.add("open");
  mark_panel_open();
  combos.theme.set_choices(combos.theme.choices);
  element("theme").focus();
}

// Blurring leaves focus on the body, like a combo pick, so the board keys work at once.
function close_settings() {
  settings_open = false;
  settings_box.classList.remove("open");
  mark_panel_open();
  end_preview();
  element("theme").blur();
}

function toggle_settings() {
  if (settings_open) close_settings();
  else open_settings();
}

element("settings-btn").addEventListener("click", () => {
  toggle_settings();
  element("settings-btn").blur();
});
settings_box.addEventListener("click", (event) => { if (event.target === settings_box) close_settings(); });
// A click on the board outside the panel ends Settings, like Escape. It waits for the click, not the press, because
// closing gives the panel's room back and moves the board. The press and release then hit the same element, so a
// single click or a drag is not lost. The click is not cancelled, so a card click or double-click still acts. The gear
// toggles on its own click, and the phone sheet's dimmed area is closed by the click handler above.
document.addEventListener("click", (event) => {
  if (settings_open && !event.target.closest("#settings, #settings-btn")) close_settings();
}, true);
element("settings-panel").firstElementChild.append(close_button(close_settings));

// The help modal. Its rows come from this one list, so the hints stay in step with the KEYS map below. A row with
// needs_terminal is dropped when the server has no terminal to open an editor in.
const HELP_SECTIONS = [
  ["Navigation", [
    [["j", "k"], "Next or previous card"],
    [["h", "l"], "Previous or next column"],
    [["g", "g"], "First card in the column"],
    [["G"], "Last card in the column"],
    [["/"], "Pick a repo"],
  ]],
  ["Cards", [
    [["o", "Enter"], "Open the doc view"],
    [["H", "L"], "Move to the previous or next status"],
    [["J", "K"], "Rank down or up"],
    [["a"], "Set the owner"],
    [["e"], "Open in the editor", { needs_terminal: true }],
    [["x"], "Cancel the card"],
  ]],
  ["Board", [
    [[","], "Settings"],
    [["?"], "This help"],
    [["Esc"], "Close a panel or this help"],
  ]],
];

let help_open = false;

function build_help() {
  const panel = element("help-panel");
  const body = [make("div", "top")];
  body[0].append(make("h2", "", "Keyboard shortcuts"), close_button(close_help));
  for (const [title, rows] of HELP_SECTIONS) {
    const list = make("dl");
    for (const [keys, text, flags = {}] of rows) {
      if (flags.needs_terminal && board && board.can_open_terminal === false) continue;
      const term = make("dt");
      term.append(...keys.map((key) => make("kbd", "", key)));
      list.append(term, make("dd", "", text));
    }
    body.push(make("h3", "", title), list);
  }
  panel.replaceChildren(...body);
}

function open_help() {
  if (settings_open) close_settings();
  help_open = true;
  build_help();
  element("help").classList.add("open");
  element("help-panel").querySelector(".close-x").focus();
}

function close_help() {
  if (!help_open) return;
  help_open = false;
  element("help").classList.remove("open");
  document.activeElement.blur();
}

element("help-btn").addEventListener("click", () => {
  if (help_open) close_help();
  else open_help();
  element("help-btn").blur();
});
element("help").addEventListener("click", (event) => { if (event.target === element("help")) close_help(); });

// Drag by pointer events rather than HTML drag and drop: the card can only land in its own lane, and the marker
// shows the slot the drop takes.
const DRAG_THRESHOLD_PX = 4;

function start_drag(event, card, doc) {
  if (event.button !== 0 || event.target.closest("a, input")) return;
  const lane = card.parentElement.dataset.lane;
  const origin = { x: event.clientX, y: event.clientY };
  let dragging = false;
  let target = null;
  const marker = make("div", "drop-marker");

  const slot_at = (x, y) => {
    const cell = document.elementsFromPoint(x, y).find((node) => node.classList.contains("cell"));
    if (!cell || cell.dataset.lane !== lane) return null;
    const cards = cell_cards(cell, doc.path);
    const index = cards.filter((other) => {
      const box = other.getBoundingClientRect();
      return box.top + box.height / 2 < y;
    }).length;
    return { cell, cards, index };
  };

  const on_move = (move) => {
    if (!dragging && Math.hypot(move.clientX - origin.x, move.clientY - origin.y) < DRAG_THRESHOLD_PX) return;
    dragging = true;
    drag_in_progress = true;
    card.classList.add("dragging");
    card.style.transform = `translate(${move.clientX - origin.x}px, ${move.clientY - origin.y}px)`;
    target = slot_at(move.clientX, move.clientY);
    marker.remove();
    if (target) target.cell.insertBefore(marker, target.cards[target.index] || null);
  };

  // Only pointerup drops. A cancelled pointer, a window that loses focus or Escape ends the drag where it began, so
  // a held reload never waits on a drag that cannot finish.
  const end_drag = (drop) => {
    document.removeEventListener("pointermove", on_move);
    document.removeEventListener("pointerup", on_up);
    document.removeEventListener("pointercancel", on_cancel);
    document.removeEventListener("keydown", on_escape, true);
    window.removeEventListener("blur", on_cancel);
    marker.remove();
    card.classList.remove("dragging");
    card.style.transform = "";
    drag_in_progress = false;
    if (drop && dragging && target) {
      const status = target.cell.dataset.status;
      move_confirmed(doc, status, drop_request(doc, status, target.cards, target.index));
    }
    release_held_reload();
  };
  const on_up = () => end_drag(true);
  const on_cancel = () => end_drag(false);
  const on_escape = (key) => {
    if (key.key !== "Escape") return;
    key.stopPropagation();
    end_drag(false);
  };

  document.addEventListener("pointermove", on_move);
  document.addEventListener("pointerup", on_up);
  document.addEventListener("pointercancel", on_cancel);
  document.addEventListener("keydown", on_escape, true);
  window.addEventListener("blur", on_cancel);
}

function typing_in_field(event) {
  return ["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName);
}

// A first g arms the chord for a moment. Any other key disarms it and then acts as usual, so a lone g swallows nothing.
const CHORD_MS = 700;
let g_armed_until = 0;

const KEYS = {
  G: () => jump_in_column(true),
  j: () => step_in_column(1),
  k: () => step_in_column(-1),
  h: () => step_column(-1),
  l: () => step_column(1),
  "/": () => element("repo").focus(),
  H: () => shift_status(-1),
  L: () => shift_status(1),
  J: () => shift_rank(1),
  K: () => shift_rank(-1),
  a: () => edit_owner(),
  e: () => open_in_editor(),
  x: () => cancel_card(),
  o: () => open_view(),
  ",": () => open_settings(),
  "?": () => open_help(),
  Enter: () => open_view(),
};

document.addEventListener("keydown", (event) => {
  if (pending_confirm) {
    event.preventDefault();
    if (["y", "n", "Escape"].includes(event.key)) answer_confirm(event.key === "y");
    return;
  }
  // Help captures every key like the confirm box. Only Escape and the key that opened it close it, and Tab stays on
  // the X, the one control inside.
  if (help_open) {
    if (event.ctrlKey || event.metaKey || event.altKey || /^F\d{1,2}$/.test(event.key)) return;
    if (event.key === "Escape" || event.key === "?") {
      event.preventDefault();
      close_help();
    } else if (event.key === "Tab") {
      event.preventDefault();
    } else if (!event.target.closest("button")) {
      event.preventDefault();
    }
    return;
  }
  // Settings captures the board keys like the confirm box. The theme box keeps typing, and its Escape closes its own
  // list first (and stops there), so an Escape that reaches this point closes the modal. A comma closes it too, so no
  // theme name may hold one.
  if (settings_open) {
    // Browser shortcuts (reload, find, zoom) are not board keys.
    if (event.ctrlKey || event.metaKey || event.altKey || /^F\d{1,2}$/.test(event.key)) return;
    if (event.key === "," || event.key === "Escape") {
      event.preventDefault();
      close_settings();
    } else if (event.key === "Tab") {
      event.preventDefault();
      element("theme").focus();
    } else if (!typing_in_field(event)) {
      // A printable key goes to the theme box, which the focus below reaches before the character lands.
      if (event.key.length === 1) element("theme").focus();
      else event.preventDefault();
    }
    return;
  }
  if (event.key === "Escape") {
    if (typing_in_field(event)) event.target.blur();
    else if (sheet_path) close_sheet();
    return;
  }
  if (typing_in_field(event) || event.ctrlKey || event.metaKey || event.altKey) return;
  // A focused button, link or Fields line in the panel takes Enter and Space itself.
  if (["Enter", " "].includes(event.key) && event.target.closest("button, a, summary")) return;
  // Holding g auto-repeats within the chord window and must not count as a second press.
  if (event.key === "g" && event.repeat) {
    event.preventDefault();
    return;
  }
  const chord_armed = Date.now() < g_armed_until;
  g_armed_until = 0;
  if (event.key === "g") {
    event.preventDefault();
    if (chord_armed) jump_in_column(false);
    else g_armed_until = Date.now() + CHORD_MS;
    return;
  }
  const action = KEYS[event.key];
  if (!action) return;
  event.preventDefault();
  action();
});

// A checkbox gives focus back after a change, so the vim keys work again at once.
element("waiting").addEventListener("change", () => {
  filters.waiting = element("waiting").checked;
  element("waiting").blur();
  fill_filter_choices();
  render();
});

apply_layout();

// The server sends the board version at connect and after each change on disk. EventSource reconnects by itself.
const events = new EventSource("/api/events");
events.addEventListener("version", (event) => {
  if (!board || server_lost || Number(event.data) !== board.version) load_board();
});
events.addEventListener("open", () => { events_open = true; sync_body_controls(); });
events.addEventListener("error", () => { events_open = false; sync_body_controls(); });
</script>
</body>
</html>
