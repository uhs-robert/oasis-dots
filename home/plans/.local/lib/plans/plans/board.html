  html[data-theme="starlight_dark"] { --bg: #000000; --panel: #0C131C; --card: #1C2028; --line: #4D4528; --text: #F5F5DC; --dim: #A3ABB8; --accent: #5BADFF; --warn: #F0E68C; --bad: #FFA0A0; --good: #A3E39A; --error-bg: #532E2E; --assignee-orange: #F8B471; --assignee-teal: #69C3AA; --assignee-sky: #87CEEB; --assignee-iris: #A870F0; --assignee-magenta: #C695FF; --overlay: rgba(11, 14, 20, 0.6); }
  html[data-theme="twilight_dark"] { --bg: #1B1320; --panel: #261A32; --card: #362343; --line: #71609A; --text: #F5F5DC; --dim: #A3ABB8; --accent: #F7997D; --warn: #F0E68C; --bad: #FFA0A0; --good: #A3E39A; --error-bg: #532E2E; --assignee-orange: #F8B471; --assignee-teal: #69C3AA; --assignee-sky: #87CEEB; --assignee-iris: #A9A9ED; --assignee-magenta: #C695FF; --overlay: rgba(18, 13, 23, 0.6); }
  /* themes:end */
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 8px 0 0; font-size: 15px; }
  header input, #settings input { background: var(--card); color: var(--text); border: 1px solid var(--line);
                                border-radius: 4px; padding: 3px 6px; font: inherit; }
  header input[type=text] { width: 14em; }
  .combo-picker { position: relative; }
  header input.combo { width: 11em; }
  #settings input.combo { width: 100%; }
  #repo { width: 16em; }
  #status, #kind { width: 9em; }
  .combo-list { position: absolute; top: 100%; left: 0; z-index: 8; display: none; min-width: 100%; max-height: 50vh;
                overflow-y: auto; margin: 2px 0 0; padding: 2px 0; list-style: none; background: var(--card);
                border: 1px solid var(--line); border-radius: 4px; }
  .combo-list.open { display: block; }
  .combo-list li { padding: 3px 8px; white-space: nowrap; cursor: pointer; }
  .combo-list li.active { background: var(--line); color: var(--accent); }
  .combo-list li.chosen { font-weight: 600; }
  .combo-list li.none { color: var(--dim); cursor: default; }
  header label { color: var(--dim); }
  #help-btn, #settings-btn { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0;
                  color: var(--dim); background: none; border: 0; border-radius: 4px; cursor: pointer; }
  #help-btn { margin-left: auto; font: 600 15px system-ui, sans-serif; }
  #help-btn:hover, #settings-btn:hover { color: var(--accent); }
  #help-btn:focus-visible, #settings-btn:focus-visible { color: var(--accent); outline: 1px solid var(--accent); }
  #message { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10; display: none;
             max-width: 80vw; padding: 8px 14px; border-radius: 6px; background: var(--bad); color: var(--bg); }
  #message.info { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  #board { display: grid; padding: 0 12px 40px; }
  :root { --header-h: 42px; --column-row-h: 26px; --repo-head-h: 36px; }
  /* Lets scrollIntoView clear all three pinned bars. */
  html { scroll-padding-top: calc(var(--header-h) + var(--column-row-h) + var(--repo-head-h)); }
  /* Sticky only works against the whole board, so the column heads share one row spanning the grid. Subgrid keeps
     the tracks identical to the cell rows below. */
  #column-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; position: sticky;
                top: var(--header-h); z-index: 4; background: var(--bg); }
  .column-head { padding: 6px; color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: 11px;
                 border-bottom: 1px solid var(--line); }
  /* One section per repo: a sticky head stays pinned only inside its own section, so the next repo's head takes over. */
  .repo-section { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; }
  /* Padding, not margin, for the gap above: a margin would leave the sticky box short and let cards show in it. */
  .repo-head { grid-column: 1 / -1; position: sticky; top: calc(var(--header-h) + var(--column-row-h)); z-index: 3;
               padding: 14px 0 4px; background: var(--bg); font-size: 14px; font-weight: 600; color: var(--accent); }
  .lane-head { grid-column: 1 / -1; padding: 2px 0 0 4px; color: var(--dim); font-size: 12px; }
  .cell { min-height: 34px; padding: 3px; border-right: 1px dashed var(--line); }
  .card { margin: 3px 0; padding: 5px 7px; background: var(--card); border: 1px solid var(--line);
          border-left: 3px solid var(--dim); border-radius: 4px; cursor: default; user-select: none; }
  .card.selected { outline: 2px solid var(--accent); }
  .card.waiting { border-left-color: var(--warn); }
  .card.problem { border-left-color: var(--bad); background: var(--error-bg); }
  .card.remote { border-style: dashed; opacity: 0.75; }
  .card .id { font-weight: 600; word-break: break-all; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; color: var(--dim); font-size: 11px; }
  .card .waiting-on { margin-top: 3px; color: var(--warn); font-size: 12px; }
  .card .error { margin-top: 3px; color: var(--bad); font-size: 11px; word-break: break-word; }
  /* Outside the filters and the repo pick: a conflict copy is a lost edit, so no view hides it. */
  .conflict { margin: 4px 8px 0; padding: 4px 8px; background: var(--error-bg); border-left: 3px solid var(--bad);
              font-size: 12px; word-break: break-all; }
  .badge { padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }
  .owner-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; }
  .badge.depends { color: var(--accent); }
  a { color: var(--accent); }
  .card.dragging { position: relative; z-index: 6; opacity: 0.85; pointer-events: none; }
  .drop-marker { height: 3px; margin: -1px 0; background: var(--accent); border-radius: 2px; }
  .owner-input { width: 100%; margin-top: 3px; background: var(--bg); color: var(--text);
                 border: 1px solid var(--accent); border-radius: 3px; font: inherit; }
  #confirm { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
             background: var(--overlay); }
  #confirm div { padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-width: 70ch; }
  #help { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
          padding: 12px; background: var(--overlay); }
  #help.open { display: flex; }
  #help-panel { width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; padding: 14px 18px 18px;
                background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #help-panel .top { display: flex; align-items: center; gap: 8px; }
  #help-panel h2 { flex: 1; margin: 0; font-size: 16px; }
  #help-panel h3 { margin: 14px 0 6px; color: var(--dim); font-size: 11px; text-transform: uppercase; }
  #help-panel dl { display: grid; grid-template-columns: 8em 1fr; gap: 6px 16px; align-items: baseline; margin: 0; }
  #help-panel dt { display: flex; flex-wrap: wrap; gap: 4px; }
  #help-panel dd { margin: 0; }
  #help-panel kbd { min-width: 1.6em; padding: 1px 6px; background: var(--card); color: var(--accent);
                    border: 1px solid var(--line); border-radius: 4px; font: 12px ui-monospace, monospace; text-align: center; }
  /* One borderless X for every panel. The doubled class and :is raise it over the panels' own button rules. */
  html :is(#sheet-panel, #settings-panel, #help-panel) button.close-x.close-x { display: flex; align-items: center; justify-content: center;
        flex: none; width: 24px; height: 24px; padding: 0; color: var(--dim); background: none; border: 0; border-radius: 4px;
        cursor: pointer; }
  html :is(#sheet-panel, #settings-panel, #help-panel) button.close-x.close-x:hover,
  html :is(#sheet-panel, #settings-panel, #help-panel) button.close-x.close-x:focus-visible { color: var(--accent); }
  html :is(#sheet-panel, #settings-panel, #help-panel) button.close-x.close-x:focus-visible { outline: 1px solid var(--accent); }
  html.phone :is(#sheet-panel, #settings-panel, #help-panel) button.close-x.close-x { width: 32px; height: 32px; }
  #settings-panel h2 { flex: 1; margin: 0; font-size: 16px; }
  #settings-panel label { display: block; margin: 14px 0 4px; color: var(--dim); }
  .hidden { display: none !important; }
  /* The phone layout (html.phone, set below PHONE_MAX_WIDTH): one status at a time as tabs, and a sheet per card.
     None of it shows on a wide screen. */
  #tabs, #sheet, #settings, #confirm .phone-only { display: none; }
  html.phone { scroll-padding-top: var(--tabs-h, 40px); }
  html.phone header { position: static; }
  html.phone #settings input { font-size: 16px; }
  /* The theme list is absolute inside the panel, so the panel needs room for it or the list clips. */
  html.phone #settings-panel { height: 70vh; }
  html.phone #help-btn, html.phone #settings-btn { width: 32px; height: 32px; }
  html.phone #repo-picker { flex: 1 1 100%; }
  html.phone #repo { width: 100%; }
  html.phone #status-picker { display: none; }
  html.phone #tabs { display: flex; position: sticky; top: 0; z-index: 5; overflow-x: auto; scrollbar-width: none;
                     background: var(--panel); border-bottom: 1px solid var(--line); }
  #tabs button { flex: none; padding: 11px 10px 9px; background: none; border: 0; border-bottom: 2px solid transparent;
                 color: var(--dim); font: 600 12px system-ui, sans-serif; text-transform: uppercase; }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #tabs .count { margin-left: 4px; font-weight: 400; }
  /* The height keeps the swipe area under the finger on a short tab. */
  html.phone #board { display: block; min-height: calc(100vh - var(--tabs-h, 40px)); padding: 0 10px 40px; }
  html.phone .repo-head { position: static; padding: 14px 0 2px; }
  html.phone .cell { min-height: 0; padding: 0; border-right: 0; }
  html.phone .card { padding: 9px 10px; font-size: 14px; }
  html.phone .card .meta { font-size: 12px; }
  .empty-tab { padding: 30px 0; color: var(--dim); text-align: center; }
  html.phone #sheet.open, html.phone #settings.open { display: flex; position: fixed; inset: 0; z-index: 8; align-items: flex-end;
                           background: var(--overlay); }
  #sheet-panel, #settings-panel { width: 100%; max-height: 88vh; overflow-y: auto; padding: 12px 14px 24px; background: var(--panel);
                 border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; font-size: 14px; }
  #sheet-panel .top, #settings-panel .top { display: flex; align-items: flex-start; gap: 8px; }
  #sheet-panel .sheet-id { flex: 1; margin: 0; font-size: 16px; word-break: break-all; }
  #sheet-panel .where { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #sheet-panel > h3 { margin: 14px 0 6px; color: var(--dim); font-size: 11px; text-transform: uppercase; }
  #sheet-panel .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #sheet-panel .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; color: var(--dim); font-size: 12px; }
  #sheet-panel .waiting-on { margin-top: 6px; color: var(--warn); }
  #sheet-panel .error { margin-top: 6px; color: var(--bad); word-break: break-word; }
  #sheet-panel button, #settings-panel button, #confirm button { padding: 8px 12px; background: var(--card); color: var(--text);
                                          border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #sheet-panel button.current { border-color: var(--accent); color: var(--accent); }
  #sheet-panel button:disabled { opacity: 0.4; }
  #sheet-owner { flex: 1; min-width: 0; padding: 8px; background: var(--bg); color: var(--text);
                 border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  /* The rendered doc. Its markup comes from render_markdown only. */
  #sheet-doc { padding: 4px 10px; background: var(--bg); border-radius: 6px; line-height: 1.45; word-break: break-word; }
  #sheet-doc h1, #sheet-doc h2, #sheet-doc h3, #sheet-doc h4 { margin: 14px 0 6px; color: var(--accent); }
  #sheet-doc h1 { font-size: 17px; } #sheet-doc h2 { font-size: 15px; } #sheet-doc h3, #sheet-doc h4 { font-size: 14px; }
  #sheet-doc p { margin: 6px 0; }
  #sheet-doc ul, #sheet-doc ol { margin: 4px 0; padding-left: 22px; }
  #sheet-doc li.task { list-style: none; margin-left: -18px; }
  #sheet-doc li.task input { margin: 0 4px 0 0; vertical-align: -1px; accent-color: var(--accent); }
  /* A 32px box, so a finger hits it. */
  html.phone #sheet-doc li.task input { width: 32px; height: 32px; margin: 2px 6px 2px -6px; vertical-align: middle; }
  #sheet-doc h2 .section-edit { margin-left: 8px; padding: 1px 8px; font-size: 12px; font-weight: 400; }
  /* 16px text: iOS zooms the page into any smaller input. */
  .section-editor textarea { width: 100%; min-height: 8em; padding: 6px; background: var(--card); color: var(--text);
                             border: 1px solid var(--accent); border-radius: 4px; font: 16px/1.4 ui-monospace, monospace; }
  .section-conflict { margin: 6px 0; }
  .section-conflict .banner { color: var(--warn); }
  .section-conflict pre { white-space: pre-wrap; }
  .section-bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 8px 0;
                 background: var(--bg); }
  .section-bar .count { flex: 1; color: var(--dim); font-size: 12px; }
  .section-bar .count.over { color: var(--bad); }
  #sheet-doc code { padding: 0 3px; background: var(--card); border-radius: 3px; font: 12px ui-monospace, monospace; }
  #sheet-doc pre { margin: 6px 0; padding: 8px; overflow-x: auto; background: var(--card); border-radius: 4px;
                   font: 12px/1.4 ui-monospace, monospace; }
  #sheet-doc pre code { padding: 0; background: none; }
  #sheet-doc pre.raw { white-space: pre-wrap; background: none; padding: 4px 0; }
  #sheet-doc hr { border: 0; border-top: 1px solid var(--line); }
  #sheet-doc details.front-matter { margin: 6px 0; color: var(--dim); font-size: 12px; }
  #sheet-doc .front-matter summary { cursor: pointer; }
  #sheet-doc .front-matter table { margin-top: 4px; border-collapse: collapse; }
  #sheet-doc .front-matter th, #sheet-doc .front-matter td { padding: 1px 10px 1px 0; text-align: left; vertical-align: top; }
  #sheet-doc .front-matter th { font-weight: 400; }
  /* On a wide screen the sheet is a side panel beside the board, so the board stays in view and the selection moves
     under it. The scroll padding keeps a selected card out from under the panel. */
  html.panel-open { --panel-w: 40vw; scroll-padding-right: var(--panel-w); }
  html.panel-open #board { margin-right: var(--panel-w); --column-min: 120px; }
  html:not(.phone) #sheet.open, html:not(.phone) #settings.open { display: block; position: fixed; top: var(--header-h); right: 0; bottom: 0; z-index: 6;
                                 width: var(--panel-w); }
  html:not(.phone) #sheet-panel, html:not(.phone) #settings-panel { height: 100%; max-height: none; border-top: 0; border-left: 1px solid var(--line);
                                  border-radius: 0; font-size: 13px; }
  html:not(.phone) #sheet-panel button, html:not(.phone) #settings-panel button { padding: 4px 9px; }
  /* Settings takes the doc view's place. The doc state stays, so closing Settings brings the doc back as it was. */
  html.settings-open #sheet.open { display: none; }
  html:not(.phone) #sheet-owner { padding: 4px 8px; }
  html.phone #confirm .phone-only { display: flex; gap: 8px; max-width: none; margin-top: 12px; padding: 0;
                                    background: none; border: 0; }
  html.phone #confirm .phone-only button { flex: 1; }
</style>
</head>
<body>

           aria-autocomplete="list" autocomplete="off" placeholder="all repos" title="repo (/)">

  <div class="combo-picker" id="status-picker">

           aria-autocomplete="list" autocomplete="off" placeholder="any status" title="status">

  </div>
  <div class="combo-picker" id="kind-picker">

           aria-autocomplete="list" autocomplete="off" placeholder="any kind" title="kind">
    <ul id="kind-list" class="combo-list" role="listbox"></ul>
  </div>
  <label title="Cards waiting on the owner: a question, an approval or a task"><input id="waiting" type="checkbox"> Needs me</label>
  <button id="help-btn" type="button" aria-label="Help" title="Help (?)">?</button>
  <button id="settings-btn" type="button" aria-label="Settings" title="Settings (,)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.7c.1.6.1 1.2 0 1.8l2 1.7-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.7c-.1-.6-.1-1.2 0-1.8l-2-1.7 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
  </button>
</header>
<nav id="tabs"></nav>
<div id="conflicts"></div>
<div id="board"></div>
<div id="sheet"><div id="sheet-panel"></div></div>
<div id="message"></div>
<div id="confirm"><div></div></div>
<div id="help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"><div id="help-panel"></div></div>
<div id="settings" role="dialog" aria-label="Settings">
  <div id="settings-panel">
    <div class="top"><h2>Settings</h2></div>
    <label for="theme">Theme</label>
    <div class="combo-picker" id="theme-picker">
      <input id="theme" class="combo" type="text" role="combobox" aria-expanded="false" aria-controls="theme-list"
             aria-autocomplete="list" autocomplete="off" placeholder="Follow desktop" title="theme">
      <ul id="theme-list" class="combo-list" role="listbox"></ul>
    </div>
  </div>
</div>
<script>
"use strict";

const ALL = "";
let board = null;
let owner_colors = new Map();
const owner_color_var = (name) => owner_colors.get(name) ? `var(${owner_colors.get(name)})` : "";
let selected_path = null;
const filters = { repo: ALL, owner: ALL, project: ALL, status: ALL, kind: ALL, waiting: false };
const element = (id) => document.getElementById(id);

// themes:start (generated by gen_board_themes.py, do not edit)
const THEMES = [
  ["abyss_dark", "Abyss"],
  ["cactus_dark", "Cactus"],
  ["canyon_dark", "Canyon"],
  ["desert_dark", "Desert"],
  ["dune_dark", "Dune"],
  ["lagoon_dark", "Lagoon"],
  ["luna_dark", "Luna"],
  ["midnight_dark", "Midnight"],
  ["mirage_dark", "Mirage"],
  ["moonlight_dark", "Moonlight"],
  ["night_dark", "Night"],
  ["rose_dark", "Rose"],
  ["scorpion_dark", "Scorpion"],
  ["sol_dark", "Sol"],
  ["starlight_dark", "Starlight"],
  ["twilight_dark", "Twilight"],
];
// themes:end
const FALLBACK_THEME = "night_dark";
const THEME_KEY = "plans-theme";
const DESKTOP_THEME_KEY = "plans-desktop-theme";
const FOLLOW = "follow";

function make(tag, class_name, text) {
  const node = document.createElement(tag);
  if (class_name) node.className = class_name;
  if (text !== undefined) node.textContent = text;
  return node;
}

// The one X every panel closes with. Its look is the .close-x rule.
function close_button(on_click) {
  const button = make("button", "close-x");
  button.type = "button";
  button.setAttribute("aria-label", "Close");
  button.title = "Close";
  button.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  button.addEventListener("click", on_click);
  return button;
}

function show_message(text, kind) {
  const box = element("message");
  box.textContent = text;
  box.className = kind || "";
  box.style.display = "block";
  clearTimeout(show_message.timer);
  show_message.timer = setTimeout(() => { box.style.display = "none"; }, 6000);
}

// laptop-key:start
// plans-open.sh opens the tailnet address as #laptop-key=<key>. The browser never sends a fragment, and the page
// strips it before its first request, so the key leaves the address bar at once.
const LAPTOP_KEY_FRAGMENT = "#laptop-key=";
const LAPTOP_KEY_STORE = "plans-laptop-key";

// The key from the fragment, else the one saved earlier, else null. It takes location, history and storage as
// arguments so a test runs it without a DOM. A null storage stands for blocked localStorage.
function adopt_laptop_key(location, history, storage) {
  const hash = location.hash;
  if (!hash.startsWith(LAPTOP_KEY_FRAGMENT)) {
    try { return storage.getItem(LAPTOP_KEY_STORE); } catch { return null; }
  }
  history.replaceState(history.state, "", location.pathname + location.search);
  const key = hash.slice(LAPTOP_KEY_FRAGMENT.length);
  if (!/^[A-Za-z0-9_-]{43}$/.test(key)) return null;
  // Without storage the key lasts until a reload, and the launcher hands it over again.
  try { storage.setItem(LAPTOP_KEY_STORE, key); } catch { /* this page only */ }
  return key;
}
// laptop-key:end

const laptop_key = adopt_laptop_key(window.location, window.history, (() => {
  try { return window.localStorage; } catch { return null; }
})());
// Only writes carry the key. The server needs it for /api/open and /api/cancel on the tailnet address.
const WRITE_HEADERS = { "Content-Type": "application/json", "X-Plans-Board": "1",
  ...(laptop_key ? { "X-Plans-Laptop-Key": laptop_key } : {}) };
// A move into one of these asks first, because it takes the doc out of the work order.
const CONFIRM_STATUSES = ["blocked", "done"];
let pending_confirm = null;
// Set when a write lost the server. The event stream reloads the board when it reconnects, even on an unchanged version.
let server_lost = false;

// One write. A refusal (409 and the rest) names the reason, and the reload snaps the card back to the disk state.
async function write(action, body) {
  let response;
  try {
    response = await fetch(`/api/${action}`, { method: "POST", headers: WRITE_HEADERS, body: JSON.stringify(body) });
  } catch {
    // The connection can drop after the server wrote, so the message cannot say that the write failed.
    server_lost = true;
    show_message(`Server unreachable: the change to ${doc_name(body.path)} may have landed. The board reloads when the server is back.`);
    return false;
  }
  const answer = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
  if (response.status === 409 && answer.keys) {
    show_message(`Refused: ${doc_name(body.path)} changed since the board read it (${answer.keys.join(", ")}). Reloaded.`);
  } else if (answer.maybe_applied) {
    show_message(`The write failed partway and may have landed: ${answer.error}. Reloaded; check the card.`);
  } else if (!response.ok) {
    show_message(`Refused: ${answer.error}`);
  } else {
    const ids = (list) => (list || []).map((doc) => doc.id).join(", ");
    const notes = [];
    if (answer.skipped && answer.skipped.length) notes.push(`these changed meanwhile or belong to another host and kept their rank: ${ids(answer.skipped)}`);
    if (answer.uncertain && answer.uncertain.length) notes.push(`these failed to write and may have the new rank: ${ids(answer.uncertain)}`);
    const kept = (answer.results || []).filter((line) => line.startsWith("skipped:"));
    if (kept.length) show_message(`Cancelled ${doc_name(body.path)}, but ${kept.join("; ")}`);
    if (notes.length) show_message(`Renumbered, but ${notes.join("; ")}`);
  }
  if (action !== "open") await load_board();
  return response.ok;
}

// The server refuses every write to a doc another host owns. The page says so before it asks or sends anything.
function refuse_read_only(doc) {
  if (!doc.remote_host) return false;
  show_message(`${doc.id} is owned on ${doc.remote_host}; edit it on that host's board.`);
  return true;
}

function doc_by_path(path) {
  for (const repo of board.repos) {
    const doc = repo.docs.find((doc) => doc.path === path);
    if (doc) return doc;
  }
  return null;
}

function doc_name(path) {
  const doc = doc_by_path(path);
  return doc ? doc.id : path;
}

function ask(question, on_yes) {
  const box = element("confirm");
  box.firstElementChild.textContent = is_phone() ? question : `${question}  y / n`;
  // The keys answer on a wide screen. A phone has no keyboard, so it gets buttons, which CSS hides elsewhere.
  const buttons = make("div", "phone-only");
  const yes = make("button", "", "Yes");
  const no = make("button", "", "No");
  yes.addEventListener("click", () => answer_confirm(true));
  no.addEventListener("click", () => answer_confirm(false));
  buttons.append(yes, no);
  box.firstElementChild.append(buttons);
  box.style.display = "flex";
  pending_confirm = on_yes;
}

function answer_confirm(yes) {
  const on_yes = pending_confirm;
  pending_confirm = null;
  element("confirm").style.display = "none";
  if (yes && on_yes) on_yes();
}

function set_status(doc, status) {
  if (refuse_read_only(doc)) return;
  const send = () => write("update", { path: doc.path, basis: { status: doc.status }, changes: { status } });
  if (CONFIRM_STATUSES.includes(status)) ask(`Move ${doc.id} to ${status}?`, send);
  else send();
}

// H and L step one status column, empty or not.
function shift_status(offset) {
  const doc = doc_by_path(selected_path);
  if (!doc) return;
  const status = board.statuses[board.statuses.indexOf(doc.status) + offset];
  if (status) set_status(doc, status);
}

// The docs of the target cell in rank order, without the moved doc, including the ones the filters hide.
// The server leaves docs without a whole-number rank out of its cell, so this does too.
function cell_docs_of(doc, status) {
  const repo = board.repos.find((repo) => repo.docs.includes(doc));
  return repo.docs.filter((other) => other.project === doc.project && other.status === status && other !== doc
    && Number.isInteger(other.rank));
}

// The neighbours of a drop at `index` among the shown cards of the cell. The server refuses the move unless the two
// are still next to each other in the full cell, so the neighbours come from the full cell: the shown card under the
// drop and the doc right before it, or the doc right after the last shown card.
function drop_request(doc, status, shown_cards, index) {
  const cell_docs = cell_docs_of(doc, status);
  let above, below;
  if (index < shown_cards.length) {
    below = doc_by_path(shown_cards[index].dataset.path);
    above = cell_docs[cell_docs.indexOf(below) - 1] || null;
  } else {
    above = index > 0 ? doc_by_path(shown_cards[index - 1].dataset.path) : null;
    below = cell_docs[above ? cell_docs.indexOf(above) + 1 : 0] || null;
  }
  return {
    path: doc.path, basis: { status: doc.status, rank: doc.rank }, status,
    above: above && above.path, below: below && below.path,
  };
}

function cell_cards(cell, without_path) {
  return [...cell.querySelectorAll(".card")].filter((card) => card.dataset.path !== without_path);
}

function move_confirmed(doc, status, request) {
  const send = () => write("move", request);
  if (status !== doc.status && CONFIRM_STATUSES.includes(status)) ask(`Move ${doc.id} to ${status}?`, send);
  else send();
}

// J and K swap the card with its neighbour in the cell, which changes only its rank.
function shift_rank(offset) {
  const doc = doc_by_path(selected_path);
  const card = selected_card();
  if (!doc || !card || refuse_read_only(doc)) return;
  const siblings = cell_cards(card.parentElement, null);
  const target = siblings.indexOf(card) + offset;
  if (target < 0 || target >= siblings.length) return;
  const others = cell_cards(card.parentElement, doc.path);
  write("move", drop_request(doc, doc.status, others, target));
}

function set_owner(doc, value) {
  if (value.trim() === doc.owner_session || refuse_read_only(doc)) return;
  // The shown session values and host go in the basis too, so a claim since the page loaded refuses the edit.
  const basis = { owner_session: doc.owner_session, owner_session_id: doc.owner_session_id,
                  owner_session_pid: doc.owner_session_pid, owner_host: doc.owner_host };
  write("update", { path: doc.path, basis, changes: { owner_session: value.trim() } });
}

function edit_owner() {
  const doc = doc_by_path(selected_path);
  const card = selected_card();
  if (!doc || !card || refuse_read_only(doc)) return;
  const input = make("input", "owner-input");
  // input.remove() fires blur, which calls close_input again on the input that is already leaving.
  let closed = false;
  const close_input = () => {
    if (closed) return;
    closed = true;
    input.remove();
    release_held_reload();
  };
  input.value = doc.owner_session;
  input.placeholder = "session name or none";
  card.append(input);
  input.focus();
  input.select();
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") set_owner(doc, input.value);
    if (event.key === "Enter" || event.key === "Escape") { event.stopPropagation(); close_input(); }
  });
  input.addEventListener("blur", close_input);
}

// An error card opens too, so the owner can fix the doc. A repo-level error card names the repo, not a doc.
function can_open(path) {
  return Boolean(doc_by_path(path))
    || board.repos.some((repo) => repo.problems.some((problem) => problem.path === path && path !== repo.root));
}

// The prompt lists every change from the server's preview. The apply request carries the same shown values, so a card
// that changed since the board loaded is refused.
async function cancel_card() {
  const doc = doc_by_path(selected_path);
  if (!doc || refuse_read_only(doc)) return;
  const basis = Object.fromEntries(["status", "owner_session", "owner_session_id", "owner_session_pid", "owner_host", "pr", "issue", "branch"].map((key) => [key, doc[key] ?? ""]));
  let answer;
  try {
    const response = await fetch("/api/cancel", { method: "POST", headers: WRITE_HEADERS, body: JSON.stringify({ path: doc.path, basis, apply: false }) });
    answer = await response.json();
    if (!response.ok) return show_message(`Refused: ${answer.error}`);
  } catch {
    return show_message("Could not read what cancel would change.");
  }
  const lines = [...answer.changes, ...answer.notes.map((note) => `(${note})`)];
  ask(`Cancel ${doc.id}? It will: ${lines.join("; ")}.`, () => write("cancel", { path: doc.path, basis, apply: true }));
}

// The phone has no editor, and the server refuses the request from it.
function open_in_editor() {
  if (board.can_open_terminal === false) return show_message("This host has no desktop session to open a terminal in.");
  if (!is_phone() && can_open(selected_path)) write("open", { path: selected_path });
}

function open_view() {
  if (selected_path && (doc_by_path(selected_path) || problem_by_path(selected_path))) open_sheet(selected_path);
}

// The owner badge, links and inputs keep their own double-click meaning, so they never open the view.
function open_view_on_dblclick(card, path) {
  card.addEventListener("dblclick", (event) => {
    if (event.target.closest("a, .owner, input")) return;
    open_sheet(path);
  });
}

// A render rebuilds every card, which would drop the owner's typing or the card under the pointer. A reload
// asked for meanwhile waits, and release_held_reload fetches the newest board once the input or the drag ends.
let held_reload = false;
let drag_in_progress = false;

function board_is_busy() {
  return drag_in_progress || Boolean(document.querySelector(".owner-input"));
}

function release_held_reload() {
  if (!held_reload) return;
  held_reload = false;
  load_board();
}

// theme-logic:start
// The theme to paint: a saved name that still exists wins, otherwise the desktop's, otherwise night. A saved name that
// is gone (a theme dropped from the generator) counts as no save, so the board follows the desktop again.
function resolve_theme(saved, desktop, names) {
  if (names.includes(saved)) return saved;
  return names.includes(desktop) ? desktop : FALLBACK_THEME;
}

// localStorage can throw (private mode, blocked storage), and a missing save is not an error.
function saved_theme() {
  try { return localStorage.getItem(THEME_KEY); } catch { return null; }
}

// The desktop theme is cached, so the first paint of a reload uses the last known one instead of night.
function known_desktop_theme() {
  try {
    if (board) {
      if (board.desktop_theme) localStorage.setItem(DESKTOP_THEME_KEY, board.desktop_theme);
      else localStorage.removeItem(DESKTOP_THEME_KEY);
      return board.desktop_theme;
    }
    return localStorage.getItem(DESKTOP_THEME_KEY);
  } catch { return board && board.desktop_theme; }
}

// A preview is a highlighted theme that is not saved. It lives here, not on the page, so a board reload or a live
// update repaints the preview instead of snapping back to the saved theme and leaving the picker out of step.
let previewing = null;

function apply_theme() {
  const names = THEMES.map(([key]) => key);
  const wanted = previewing === null ? saved_theme() : previewing;
  document.documentElement.dataset.theme = resolve_theme(wanted, known_desktop_theme(), names);
}

// The value the picker shows as chosen: the saved theme, or FOLLOW when none is saved or the saved one is gone.
function chosen_theme() {
  const saved = saved_theme();
  return THEMES.some(([key]) => key === saved) ? saved : FOLLOW;
}

// FOLLOW removes the save, so the board follows the desktop again.
function set_theme(value) {
  try {
    if (value === FOLLOW) localStorage.removeItem(THEME_KEY);
    else localStorage.setItem(THEME_KEY, value);
  } catch { /* the pick still applies for this page */ }
  previewing = null;
  apply_theme();
}

// A null value (no row highlighted) ends the preview.
function preview_theme(value) {
  previewing = value;
  apply_theme();
}

function end_preview() {
  previewing = null;
  apply_theme();
}
// theme-logic:end

apply_theme();

async function load_board() {
  if (board_is_busy()) { held_reload = true; return; }
  const response = await fetch("/api/board", { cache: "no-store" });
  const fresh = await response.json();
  // Two loads can finish out of order, and the older answer must not replace the newer board.
  if (board && fresh.version < board.version) return;
  if (board_is_busy()) { held_reload = true; return; }
  board = fresh;
  owner_colors = assign_owner_colors(board.repos.flatMap((repo) => repo.docs.map((doc) => doc.owner_session ?? "")));
  server_lost = false;
  apply_theme();
  fill_filter_choices();
  render();
}

// An owner or project can be the empty string, which is ALL, or null or missing. This stand-in keeps those docs
// pickable under one "(unassigned)" row. The text "none", the explicit unowned marker, joins them (see owner_key).
const UNSET = "\u0000unset";
const doc_value = (doc, key) => (doc[key] ?? "") === "" ? UNSET : String(doc[key]);

// Each filter combo and the front matter key it compares.
const SELECT_FILTER_KEYS = { owner: "owner_session", project: "project", status: "status", kind: "kind" };
const filter_value = (doc, filter) => doc_value(doc, SELECT_FILTER_KEYS[filter]);

// The docs the lists draw from: the picked repo's, so the repo pick scopes every list.
function scoped_docs() {
  return board.repos.filter((repo) => filters.repo === ALL || repo.root === filters.repo)
    .flatMap((repo) => repo.docs);
}

function fill_filter_choices() {
  // First, so a vanished repo pick resets to ALL before the lists are scoped by it.
  combos.repo.set_choices(board.repos.filter((repo) => repo.docs.length || repo.problems.length)
    .map((repo) => ({ ...repo, value: repo.root })));
  const docs = scoped_docs();
  const all_docs = board.repos.flatMap((repo) => repo.docs);
  const board_order = { status: board.statuses, kind: board.kinds };
  const choices_for = (filter) => {
    const values = facet_choices(docs, filters, filter, filter_value, all_docs);
    const order = board_order[filter];
    // Status and kind keep the board's own order. A picked value off that list sorts last.
    if (order) values.sort((a, b) => (order.indexOf(a) + 1 || Infinity) - (order.indexOf(b) + 1 || Infinity));
    return values.map((value) => ({ value, label: value === UNSET ? "(unassigned)" : value === OWNER_ASSIGNED ? "(assigned)" : value }));
  };
  for (const filter of Object.keys(SELECT_FILTER_KEYS)) combos[filter].set_choices(choices_for(filter));
}

function doc_is_shown(doc) {
  return doc_passes(doc, filters, null, filter_value);
}

// An unreadable doc has no keys to filter on, so any select filter hides it.
function problem_is_shown() {
  const select_filter_set = Object.keys(SELECT_FILTER_KEYS).some((filter) => filters[filter] !== ALL);
  return !select_filter_set && !filters.waiting;
}

function pr_link(repo, pr) {
  if (pr === null || pr === undefined || pr === "none" || pr === "") return null;
  const text = String(pr);
  if (/^https?:\/\//.test(text)) return { href: text, label: "PR" };
  const number = text.replace(/^#/, "");
  if (/^[0-9]+$/.test(number) && repo.web_url) return { href: `${repo.web_url}/pull/${number}`, label: `#${number}` };
  return { href: null, label: `PR ${text}` };
}

function card_node(repo, doc) {
  const card = make("div", "card");
  card.dataset.path = doc.path;
  card.dataset.status = doc.status;
  if (doc.waiting_on) card.classList.add("waiting");
  if (doc.remote_host) card.classList.add("remote");
  card.append(make("div", "id", doc.id));
  const meta = make("div", "meta");
  meta.append(make("span", "badge", doc.kind), make("span", "badge owner", doc.owner_session),
              make("span", "badge", `rank ${doc.rank}`));
  const link = pr_link(repo, doc.pr);
  if (link) {
    const node = link.href ? make("a", "badge", link.label) : make("span", "badge", link.label);
    if (link.href) { node.href = link.href; node.target = "_blank"; node.rel = "noopener"; }
    meta.append(node);
  }
  for (const dependency of doc.depends_on || []) meta.append(make("span", "badge depends", `after ${dependency}`));
  if (doc.remote_host) meta.append(make("span", "badge", `on ${doc.remote_host}, read-only`));
  const owner_tint = owner_color_var(doc.owner_session);
  if (owner_tint) meta.querySelector(".owner").style.cssText = `color: ${owner_tint}; border-color: ${owner_tint}`;
  card.append(meta);
  if (doc.waiting_on) card.append(make("div", "waiting-on", `waiting: ${doc.waiting_on}`));
  if (is_phone()) {
    card.addEventListener("click", (event) => { if (!event.target.closest("a")) open_sheet(doc.path); });
    return card;
  }
  card.addEventListener("click", () => select_card(doc.path));
  open_view_on_dblclick(card, doc.path);
  if (doc.remote_host) return card;
  card.querySelector(".owner").addEventListener("click", () => { select_card(doc.path); edit_owner(); });
  card.querySelector(".owner").title = "click or a: change the owner";
  card.addEventListener("pointerdown", (event) => start_drag(event, card, doc));
  return card;
}

function problem_node(problem) {
  const card = make("div", "card problem");
  card.dataset.path = problem.path;
  card.append(make("div", "id", problem.id), make("div", "error", problem.error));
  if (is_phone()) {
    card.addEventListener("click", () => open_sheet(problem.path));
    return card;
  }
  card.addEventListener("click", () => select_card(problem.path));
  open_view_on_dblclick(card, problem.path);
  return card;
}

function lane_cells(container, statuses, lane_key) {
  const cells = {};
  for (const status of statuses) {
    const cell = make("div", "cell");
    cell.dataset.status = status;
    cell.dataset.lane = lane_key;
    container.append(cell);
    cells[status] = cell;
  }
  return cells;
}

function measure_heads() {
  const root = document.documentElement.style;
  root.setProperty("--header-h", `${document.querySelector("header").getBoundingClientRect().height}px`);
  const row = element("column-row");
  if (row) root.setProperty("--column-row-h", `${row.getBoundingClientRect().height}px`);
  const repo_head = document.querySelector(".repo-head");
  if (repo_head) root.setProperty("--repo-head-h", `${repo_head.getBoundingClientRect().height}px`);
}
const row_observer = new ResizeObserver(measure_heads);
new ResizeObserver(measure_heads).observe(document.querySelector("header"));

function render_conflicts() {
  element("conflicts").replaceChildren(...board.repos.flatMap((repo) => (repo.conflicts ?? []).map(
    (conflict) => make("div", "conflict", `conflict: ${conflict.message} (${conflict.path})`))));
}

function render() {
  render_conflicts();
  if (is_phone()) return render_phone();
  const container = element("board");
  const statuses = board.statuses;
  container.style.gridTemplateColumns = `repeat(${statuses.length}, minmax(var(--column-min, 150px), 1fr))`;
  const column_row = make("div");
  column_row.id = "column-row";
  column_row.append(...statuses.map((status) => make("div", "column-head", status)));
  container.replaceChildren(column_row);
  row_observer.disconnect();
  row_observer.observe(column_row);
  measure_heads();
  for (const repo of board.repos) {
    if (filters.repo !== ALL && repo.root !== filters.repo) continue;
    const docs = repo.docs.filter(doc_is_shown);
    if (!docs.length && !repo.problems.some(problem_is_shown)) continue;
    const section = make("div", "repo-section");
    container.append(section);
    section.append(make("div", "repo-head", repo.label));
    const problems = repo.problems.filter(problem_is_shown);
    if (problems.length) {
      section.append(make("div", "lane-head", "unreadable"));
      const cells = lane_cells(section, statuses, `${repo.root}\n`);
      for (const problem of problems) cells[problem.status || statuses[0]].append(problem_node(problem));
    }
    const projects = [...new Set(docs.map((doc) => doc.project))].sort();
    for (const project of projects) {
      section.append(make("div", "lane-head", project));
      const cells = lane_cells(section, statuses, `${repo.root}\n${project}`);
      for (const doc of docs.filter((doc) => doc.project === project)) {
        cells[statuses.includes(doc.status) ? doc.status : statuses[0]].append(card_node(repo, doc));
      }
    }
  }
  const cards = all_cards();
  if (!cards.some((card) => card.dataset.path === selected_path)) selected_path = cards.length ? cards[0].dataset.path : null;
  mark_selected();
  measure_heads();
  if (sheet_path) follow_selection();
}

function all_cards() { return [...document.querySelectorAll("#board .card")]; }
function selected_card() { return all_cards().find((card) => card.dataset.path === selected_path) || null; }

// edge is "top" or "bottom" to scroll the window fully, past the sticky bars and the repo and lane titles that
// "nearest" leaves hidden.
function select_card(path, edge) {
  selected_path = path;
  mark_selected();
  if (sheet_path && path !== sheet_path) follow_selection();
  const card = selected_card();
  if (!card) return;
  if (!edge) {
    card.scrollIntoView({ block: "nearest", inline: "nearest" });
    return;
  }
  window.scrollTo({ top: edge === "top" ? 0 : document.documentElement.scrollHeight });
  // The column's end card can sit in a lane far from the page end. Keep it in view rather than lose the selection.
  // The window also scrolls sideways when the columns do not fit, so reveal the card's column as "nearest" does.
  const view_width = document.documentElement.clientWidth - side_panel_width();
  const side = card.getBoundingClientRect();
  if (side.left < 0) window.scrollBy({ left: side.left });
  else if (side.right > view_width) window.scrollBy({ left: Math.min(side.right - view_width, side.left) });
  const rect = card.getBoundingClientRect();
  const repo_head = card.closest(".repo-section").querySelector(".repo-head");
  const sticky_bottom = document.querySelector(".column-head").getBoundingClientRect().bottom + repo_head.getBoundingClientRect().height;
  const view_bottom = document.documentElement.clientHeight;
  if (rect.top >= sticky_bottom && rect.bottom <= view_bottom) return;
  window.scrollBy({ top: edge === "top" ? rect.top - sticky_bottom : rect.bottom - view_bottom });
}

function mark_selected() {
  for (const card of all_cards()) card.classList.toggle("selected", card.dataset.path === selected_path);
}

function column_index(card) { return board.statuses.indexOf(card.parentElement.dataset.status); }

// j and k walk one column top to bottom across every lane, so they never jump sideways.
function step_in_column(offset) {
  const card = selected_card();
  if (!card) return;
  const column = all_cards().filter((other) => column_index(other) === column_index(card));
  const target = column[column.indexOf(card) + offset] || card;
  const at_end = target === column[offset < 0 ? 0 : column.length - 1];
  select_card(target.dataset.path, at_end ? (offset < 0 ? "top" : "bottom") : undefined);
}

// gg and G pick the first or last card of the current column. With no selection they use the first column that has cards.
function jump_in_column(last) {
  const cards = all_cards();
  const card = selected_card() || cards[0];
  if (!card) return;
  const column = cards.filter((other) => column_index(other) === column_index(card));
  select_card(column[last ? column.length - 1 : 0].dataset.path, last ? "bottom" : "top");
}

// h and l go to the nearest column that has cards, and there to the card closest in height to the current one.
function step_column(offset) {
  const card = selected_card();
  if (!card) return;
  const top = card.getBoundingClientRect().top;
  for (let column = column_index(card) + offset; column >= 0 && column < board.statuses.length; column += offset) {
    const candidates = all_cards().filter((other) => column_index(other) === column);
    if (!candidates.length) continue;
    const distance = (other) => Math.abs(other.getBoundingClientRect().top - top);
    candidates.sort((a, b) => distance(a) - distance(b));
    select_card(candidates[0].dataset.path);
    return;
  }
}

// The phone layout. Below PHONE_MAX_WIDTH the board shows one status at a time, with a tab per status and a swipe to
// the next or previous one. A tap on a card opens a sheet with its actions and the rendered doc. The sheet writes
// through write(), as the keys do, so it gets the same refusals. It has no cancel and no editor: the server refuses
// both from the phone. On a wide screen the same sheet is the doc view, a side panel that follows the selection.
const PHONE_MAX_WIDTH = 600;
const SWIPE_MIN_PX = 60;
const DEFAULT_TAB = "building";
const phone_query = matchMedia(`(max-width: ${PHONE_MAX_WIDTH}px)`);
let phone_status = null;
let sheet_path = null;
let settings_open = false;

function is_phone() { return phone_query.matches; }

function apply_layout() {
  document.documentElement.classList.toggle("phone", is_phone());
  element("board").style.gridTemplateColumns = "";
  // The tabs replace the status filter, which the phone hides.
  if (is_phone() && filters.status !== ALL) {
    combos.status.reset();
    if (board) fill_filter_choices();
  }
  mark_panel_open();
  if (board) render();
}

function shown_status(doc) { return board.statuses.includes(doc.status) ? doc.status : board.statuses[0]; }

function render_phone() {
  const statuses = board.statuses;
  const repos = board.repos.filter((repo) => filters.repo === ALL || repo.root === filters.repo).map((repo) => ({
    repo, docs: repo.docs.filter(doc_is_shown), problems: repo.problems.filter(problem_is_shown),
  }));
  const counts = Object.fromEntries(statuses.map((status) => [status, 0]));
  for (const { docs, problems } of repos) {
    for (const item of [...docs, ...problems]) counts[shown_status(item)] += 1;
  }
  // The tab follows the card in the sheet, so a status change keeps it in view behind the sheet.
  const sheet_doc = sheet_path && doc_by_path(sheet_path);
  if (sheet_doc) phone_status = shown_status(sheet_doc);
  // The first visit opens on the work in flight, else on the first status that has cards.
  if (!statuses.includes(phone_status)) {
    phone_status = counts[DEFAULT_TAB] ? DEFAULT_TAB : statuses.find((status) => counts[status]) || statuses[0];
  }
  render_tabs(counts);
  const container = element("board");
  container.replaceChildren();
  for (const { repo, docs, problems } of repos) {
    const tab_docs = docs.filter((doc) => shown_status(doc) === phone_status);
    const tab_problems = problems.filter((problem) => shown_status(problem) === phone_status);
    if (!tab_docs.length && !tab_problems.length) continue;
    const section = make("div", "repo-section");
    container.append(section);
    section.append(make("div", "repo-head", repo.label));
    if (tab_problems.length) {
      section.append(make("div", "lane-head", "unreadable"));
      lane_cells(section, [phone_status], `${repo.root}\n`)[phone_status].append(...tab_problems.map(problem_node));
    }
    for (const project of [...new Set(tab_docs.map((doc) => doc.project))].sort()) {
      section.append(make("div", "lane-head", project));
      const cell = lane_cells(section, [phone_status], `${repo.root}\n${project}`)[phone_status];
      cell.append(...tab_docs.filter((doc) => doc.project === project).map((doc) => card_node(repo, doc)));
    }
  }
  if (!container.children.length) container.append(make("div", "empty-tab", `No cards in ${phone_status}.`));
  if (sheet_path) refresh_sheet();
}

function render_tabs(counts) {
  const tabs = element("tabs");
  tabs.replaceChildren(...board.statuses.map((status) => {
    const tab = make("button", status === phone_status ? "active" : "", status);
    tab.append(make("span", "count", String(counts[status])));
    tab.addEventListener("click", () => show_tab(status));
    return tab;
  }));
  document.documentElement.style.setProperty("--tabs-h", `${tabs.getBoundingClientRect().height}px`);
  tabs.querySelector(".active")?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function show_tab(status) {
  if (!status || status === phone_status) return;
  phone_status = status;
  render();
  window.scrollTo({ top: 0 });
}

let swipe_start = null;
element("board").addEventListener("touchstart", (event) => {
  swipe_start = event.touches.length === 1 ? { x: event.touches[0].clientX, y: event.touches[0].clientY } : null;
}, { passive: true });
element("board").addEventListener("touchend", (event) => {
  if (!swipe_start || !is_phone()) return;
  const dx = event.changedTouches[0].clientX - swipe_start.x;
  const dy = event.changedTouches[0].clientY - swipe_start.y;
  swipe_start = null;
  // A mostly sideways stroke flips the tab. Anything steeper is a scroll.
  if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const statuses = board.statuses;
  show_tab(statuses[statuses.indexOf(phone_status) + (dx < 0 ? 1 : -1)]);
}, { passive: true });

function problem_by_path(path) {
  for (const repo of board.repos) {
    const problem = repo.problems.find((problem) => problem.path === path && path !== repo.root);
    if (problem) return problem;
  }
  return null;
}

function open_sheet(path) {
  // A doc takes the panel back from Settings, and the previewed theme goes with it.
  if (settings_open) close_settings();
  if (path === sheet_path) return select_card(path);
  sheet_path = path;
  selected_path = path;
  element("sheet").classList.add("open");
  mark_panel_open();
  build_sheet();
  refresh_sheet();
  // Select only now, so the scroll sees the board the panel narrowed.
  select_card(path);
}

function close_sheet() {
  sheet_path = null;
  element("sheet").classList.remove("open");
  mark_panel_open();
}

function side_panel_width() {
  return (sheet_path || settings_open) && !is_phone() ? element(settings_open ? "settings" : "sheet").offsetWidth : 0;
}

function mark_panel_open() {
  document.documentElement.classList.toggle("panel-open", Boolean(sheet_path || settings_open) && !is_phone());
  document.documentElement.classList.toggle("settings-open", settings_open);
}

// The desktop panel shows the selected card. A selection the filters cleared leaves the panel on its doc.
function follow_selection() {
  if (is_phone() || !selected_path || selected_path === sheet_path) return refresh_sheet();
  sheet_path = selected_path;
  build_sheet();
  refresh_sheet();
}

element("sheet").addEventListener("click", (event) => { if (event.target === element("sheet")) close_sheet(); });

// The sheet is built once per card and then updated in place on each board load, so a reload never drops the owner
// field's typing or the button under the finger.
function build_sheet() {
  const panel = element("sheet-panel");
  const close = close_button(close_sheet);
  const top = make("div", "top");
  const title = make("div");
  title.style.flex = "1";
  title.append(make("h2", "sheet-id"), make("div", "where"));
  top.append(title, close);
  panel.replaceChildren(top, make("div", "meta-slot"));
  if (doc_by_path(sheet_path)) {
    const statuses = make("div", "row statuses");
    for (const status of board.statuses) {
      const button = make("button", "", status);
      button.dataset.status = status;
      button.addEventListener("click", () => {
        const doc = doc_by_path(sheet_path);
        if (doc && doc.status !== status) set_status(doc, status);
      });
      statuses.append(button);
    }
    const ranks = make("div", "row");
    const up = make("button", "rank-up", "Up");
    const down = make("button", "rank-down", "Down");
    up.addEventListener("click", () => shift_rank(-1));
    down.addEventListener("click", () => shift_rank(1));
    ranks.append(up, down, make("span", "where rank-note"));
    const owner = make("div", "row");
    const input = make("input");
    input.id = "sheet-owner";
    input.placeholder = "session name or none";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    const save = make("button", "", "Set");
    const free = make("button", "", "None");
    const send = (value) => { const doc = doc_by_path(sheet_path); if (doc) set_owner(doc, value); };
    save.addEventListener("click", () => send(input.value));
    free.addEventListener("click", () => send("none"));
    input.addEventListener("keydown", (event) => {
      event.stopPropagation();
      if (event.key === "Enter") send(input.value);
      if (event.key === "Enter" || event.key === "Escape") input.blur();
    });
    owner.append(input, save, free);
    panel.append(make("h3", "", "Status"), statuses, make("h3", "", "Rank"), ranks, make("h3", "", "Owner"), owner);
  }
  const doc_text = make("div", "", "Loading...");
  doc_text.id = "sheet-doc";
  shown_doc_text = null;
  // The editor leaves with the box. Its draft stays in localStorage and comes back with the doc.
  section_edit = null;
  panel.append(make("h3", "", "Doc"), doc_text);
  panel.scrollTop = 0;
}

function refresh_sheet() {
  const doc = doc_by_path(sheet_path);
  const problem = doc ? null : problem_by_path(sheet_path);
  if (!doc && !problem) return close_sheet();
  const panel = element("sheet-panel");
  // A doc that turns readable or unreadable on disk needs the other set of controls.
  if (Boolean(doc) !== Boolean(panel.querySelector("#sheet-owner"))) build_sheet();
  const repo = board.repos.find((repo) => (doc ? repo.docs.includes(doc) : repo.problems.includes(problem)));
  panel.querySelector(".sheet-id").textContent = (doc || problem).id;
  panel.querySelector(".where").textContent = doc ? `${repo.label} / ${doc.project}` : repo.label;
  const slot = panel.querySelector(".meta-slot");
  if (doc) {
    // The card's own badges and waiting line, without its handlers.
    const card = card_node(repo, doc);
    slot.replaceChildren(...[...card.children].filter((node) => !node.classList.contains("id")));
    for (const button of panel.querySelectorAll(".statuses button")) {
      button.classList.toggle("current", button.dataset.status === doc.status);
    }
    const card_in_tab = selected_card();
    const siblings = card_in_tab ? cell_cards(card_in_tab.parentElement, null) : [];
    const place = siblings.indexOf(card_in_tab);
    panel.querySelector(".rank-up").disabled = place <= 0;
    panel.querySelector(".rank-down").disabled = place < 0 || place >= siblings.length - 1;
    panel.querySelector(".rank-note").textContent = `rank ${doc.rank}`;
    const input = element("sheet-owner");
    // A value the owner is typing stays. Only an untouched field follows the board.
    if (input.value === (input.dataset.shown ?? "")) input.value = doc.owner_session;
    input.dataset.shown = doc.owner_session;
  } else {
    slot.replaceChildren(make("div", "error", problem.error));
  }
  load_sheet_doc(sheet_path);
}

// The text the doc box shows, so a board update that leaves the doc as it was keeps the box and its scroll.
let shown_doc_text = null;
// The doc's sections as the server read them, title -> content: the editor's first text and its basis.
let shown_sections = new Map();

async function load_sheet_doc(path) {
  let answer = {};
  let readable = false;
  try {
    const response = await fetch(`/api/doc?path=${encodeURIComponent(path)}`, { cache: "no-store" });
    answer = await response.json();
    readable = response.ok;
    if (!readable) answer = { text: `Cannot read the doc: ${answer.error}` };
  } catch {
    answer = { text: "Cannot reach the server." };
  }
  const text = answer.text;
  // The sheet can have moved to another card while the request ran.
  if (path !== sheet_path) return;
  // An open editor keeps the whole box as it is, so a board update never takes the owner's text away.
  if (section_edit) return sync_body_controls();
  // An unreadable doc shows its raw text, since the parse that failed is what the owner needs to see.
  const doc = readable ? doc_by_path(path) : null;
  const shown = `${Boolean(doc)}\n${text}`;
  if (shown === shown_doc_text) return sync_body_controls();
  shown_doc_text = shown;
  const box = element("sheet-doc");
  if (!doc) return box.replaceChildren(make("pre", "raw", text));
  const repo = board.repos.find((repo) => repo.docs.includes(doc));
  const issue_href = (number) => (repo.web_url ? `${repo.web_url}/issues/${number}` : null);
  shown_sections = new Map((answer.sections || []).map((section) => [section.title, section.text]));
  // Safe as innerHTML: render_markdown escapes the doc text before it adds any markup (see markdown:start).
  box.innerHTML = render_markdown(text, { issue_href, editable: true });
  for (const heading of box.querySelectorAll("h2[data-section]")) {
    const title = heading.dataset.section;
    if (!shown_sections.has(title)) continue;
    const edit_button = make("button", "section-edit", "Edit");
    edit_button.title = `Edit the ${title} section`;
    edit_button.addEventListener("click", () => open_section_editor({ path, title, basis_text: shown_sections.get(title), text: null }));
    heading.append(edit_button);
  }
  sync_body_controls();
  restore_section_draft(path);
}

// Body edits: a checkbox tap and the section editor. Both are off for a doc owned on another host and while the
// board has lost the server.
const MAX_SECTION_BYTES = 16 * 1024;
// False while the event stream is down, which is when the board counts as offline.
let events_open = false;
// The open editor: { path, title, basis_text, text, current_text }. current_text is set after the server refused
// the save because the section changed, and holds the section as it is now.
let section_edit = null;
let section_saving = false;

function body_editable() {
  const doc = doc_by_path(sheet_path);
  return Boolean(doc) && !doc.remote_host && !server_lost && events_open;
}

function sync_body_controls() {
  const box = element("sheet-doc");
  if (!box) return;
  const editable = body_editable();
  for (const input of box.querySelectorAll("li.task > input")) input.disabled = !editable;
  for (const edit_button of box.querySelectorAll(".section-edit")) edit_button.classList.toggle("hidden", !editable || Boolean(section_edit));
}

element("sheet").addEventListener("change", async (event) => {
  const input = event.target;
  if (!input.matches("#sheet-doc li.task > input")) return;
  const doc = doc_by_path(sheet_path);
  const to = input.checked;
  const item = input.parentElement;
  const done = doc && !refuse_read_only(doc)
    && await write("toggle", { path: doc.path, line: item.dataset.line, nth: Number(item.dataset.nth), to });
  // A refusal that leaves the doc text as it was redraws nothing, so the box goes back by hand.
  if (!done) input.checked = !to;
});

// The localStorage copy outlives a page reload or a closed sheet. A save or a cancel removes it.
function draft_key(path, title) { return `${path}#${title}`; }

function store_draft() {
  const { path, title, basis_text, text, current_text } = section_edit;
  try {
    localStorage.setItem(draft_key(path, title), JSON.stringify({ path, title, basis_text, text, current_text }));
  } catch {
    // Storage full or blocked: the draft lives in memory only.
  }
}

function drop_draft(edit) {
  try { localStorage.removeItem(draft_key(edit.path, edit.title)); } catch { /* as in store_draft */ }
}

function stored_drafts(path) {
  const drafts = [];
  try {
    for (let index = 0; index < localStorage.length; index += 1) {
      const key = localStorage.key(index);
      if (key.startsWith(`${path}#`)) drafts.push(JSON.parse(localStorage.getItem(key)));
    }
  } catch {
    // Blocked storage or a broken entry: no draft to restore.
  }
  return drafts;
}

function restore_section_draft(path) {
  if (section_edit || !body_editable()) return;
  const draft = stored_drafts(path).find((draft) => draft && draft.path === path && shown_sections.has(draft.title));
  if (!draft) return;
  open_section_editor(draft);
  show_message(`Restored your unsaved edit of ${draft.title}.`, "info");
}

// Shown without the blank lines around it. The server puts one blank line after the heading on save.
function trimmed_section(text) {
  return text.replace(/\r\n?/g, "\n").replace(/^\s*\n/, "").replace(/\s+$/, "");
}

function section_bytes(text) { return new TextEncoder().encode(text).length; }

function open_section_editor(edit) {
  if (section_edit) return show_message("Save or cancel the open edit first.", "info");
  const box = element("sheet-doc");
  const heading = [...box.querySelectorAll("h2[data-section]")].find((node) => node.dataset.section === edit.title);
  if (!heading) return;
  section_edit = { ...edit, text: edit.text ?? trimmed_section(edit.basis_text) };
  for (let node = heading.nextElementSibling; node && !/^H[12]$/.test(node.tagName); node = node.nextElementSibling) {
    node.classList.add("hidden");
  }
  const editor = make("div", "section-editor");
  const area = make("textarea");
  area.value = section_edit.text;
  area.spellcheck = false;
  area.setAttribute("autocapitalize", "off");
  const conflict = make("div", "section-conflict hidden");
  const bar = make("div", "section-bar");
  const count = make("span", "count");
  const save = make("button", "save", "Save");
  const cancel = make("button", "", "Cancel");
  bar.append(count, save, cancel);
  editor.append(area, conflict, bar);
  heading.after(editor);
  const fit = () => {
    area.style.height = "auto";
    area.style.height = `${area.scrollHeight}px`;
    const bytes = section_bytes(area.value);
    count.textContent = `${bytes} of ${MAX_SECTION_BYTES} bytes`;
    count.classList.toggle("over", bytes > MAX_SECTION_BYTES);
    save.disabled = bytes > MAX_SECTION_BYTES;
  };
  area.addEventListener("input", () => {
    section_edit.text = area.value;
    store_draft();
    fit();
  });
  save.addEventListener("click", () => {
    // After a refusal the owner has seen the section as it is now, so it becomes the basis.
    if (section_edit.current_text != null) section_edit.basis_text = section_edit.current_text;
    save_section();
  });
  cancel.addEventListener("click", cancel_section_edit);
  show_section_conflict();
  fit();
  sync_body_controls();
  area.focus();
}

function show_section_conflict() {
  const editor = element("sheet-doc").querySelector(".section-editor");
  const current = section_edit.current_text;
  const conflict = editor.querySelector(".section-conflict");
  conflict.classList.toggle("hidden", current == null);
  editor.querySelector(".save").textContent = current == null ? "Save" : "Save over it";
  if (current == null) return;
  const shown = trimmed_section(current);
  conflict.replaceChildren(
    make("div", "banner", "The section changed since you opened it. Your text is above, the section as it is now below."),
    make("pre", "", shown || "(empty)"));
}

function close_section_editor() {
  drop_draft(section_edit);
  section_edit = null;
  // Redraw from the disk, which may have changed while the editor held the box.
  shown_doc_text = null;
  if (sheet_path) load_sheet_doc(sheet_path);
}

function cancel_section_edit() {
  const edit = section_edit;
  if (!edit) return;
  const changed = edit.text !== trimmed_section(edit.basis_text);
  if (changed) ask(`Drop your edit of ${edit.title}?`, () => { if (section_edit === edit) close_section_editor(); });
  else close_section_editor();
}

// A refusal keeps the editor open with the owner's text. Only a save that landed closes it.
async function save_section() {
  const edit = section_edit;
  if (!edit || section_saving) return;
  section_saving = true;
  // Text typed during the request is not in the save, and a landed save closes the editor and drops it.
  const editor = element("sheet-doc").querySelector(".section-editor");
  const lock_editor = (locked) => {
    if (!editor) return;
    editor.querySelector("textarea").readOnly = locked;
    editor.querySelector(".save").disabled = locked || section_bytes(edit.text) > MAX_SECTION_BYTES;
  };
  lock_editor(true);
  let response;
  let answer;
  try {
    response = await fetch("/api/section", { method: "POST", headers: WRITE_HEADERS, body: JSON.stringify(
      { path: edit.path, title: edit.title, basis_text: edit.basis_text, text: edit.text }) });
    answer = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
  } catch {
    server_lost = true;
    sync_body_controls();
    show_message("Server unreachable: the section may have saved. Your text stays here; save again once the board is back.");
    return;
  } finally {
    section_saving = false;
    lock_editor(false);
  }
  // The draft goes even when the owner moved to another card meanwhile, or it comes back over the saved text.
  if (response.ok) drop_draft(edit);
  if (section_edit !== edit) return;
  if (response.ok) {
    close_section_editor();
    await load_board();
    return;
  }
  if (response.status === 409 && typeof answer.current_text === "string") {
    edit.current_text = answer.current_text;
    store_draft();
    show_section_conflict();
    return;
  }
  show_message(`Refused: ${answer.error}. Your text stays in the editor.`);
}

phone_query.addEventListener("change", apply_layout);

// fuzzy:start
// Subsequence match, case-insensitive. Higher is better, -Infinity is no match. A late hit in a long name can score below zero and still match. A consecutive run and a hit at a word start
// score extra, a gap costs a little, and a shorter text wins a tie.
function fuzzy_score(query, text) {
  query = query.toLowerCase();
  text = text.toLowerCase();
  let score = 0;
  let at = 0;
  let run = 0;
  for (const character of query) {
    const found = text.indexOf(character, at);
    if (found < 0) return -Infinity;
    run = found === at ? run + 1 : 0;
    const at_boundary = found === 0 || "/-_. ".includes(text[found - 1]);
    score += 1 + run * 2 + (at_boundary ? 3 : 0) - (found - at) * 0.1;
    at = found + 1;
  }
  return score - text.length * 0.01;
}

// Keeps the items whose score is a match, best first. Equal scores keep the input order, so a sorted input stays A to Z.
function rank_by(query, items, score_of) {
  if (!query) return items.slice();
  const scored = [];
  for (const item of items) {
    const best = score_of(item);
    if (best > -Infinity) scored.push({ item, best });
  }
  return scored.map((entry, index) => ({ ...entry, index }))
    .sort((a, b) => b.best - a.best || a.index - b.index)
    .map((entry) => entry.item);
}

// A repo matches on its owner/name label or its folder name. The folder gets a small bonus so a typed folder name
// finds its repo first.
function rank_repos(query, repos) {
  return rank_by(query, repos, (repo) => {
    const folder = repo.root.split("/").filter(Boolean).pop() || "";
    return Math.max(fuzzy_score(query, repo.label), fuzzy_score(query, folder) + 2);
  });
}

// The other filters match on the label alone.
function rank_choices(query, choices) {
  return rank_by(query, choices, (choice) => fuzzy_score(query, choice.label));
}

// The card view and the filter lists share one rule. skip_filter names the list being built, which its own pick
// must not narrow. value_of(doc, filter) reads the value a select filter compares.
const SELECT_FILTERS = ["owner", "project", "status", "kind"];
// The owner box also holds two rows that are not sessions. NUL-prefixed, so no real session name can equal them.
// "(unassigned)" is the stand-in for an empty or missing owner, and the text "none" counts as that too.
const OWNER_ASSIGNED = "\u0000assigned";
// Must equal UNSET above. This block is cut out and run alone by the node test, so it cannot reference UNSET.
const OWNER_UNASSIGNED = "\u0000unset";
const owner_key = (value) => value === "none" ? OWNER_UNASSIGNED : value;
// The value a doc has under a filter, for comparing with that filter's pick.
function pick_value(doc, filter, value_of) {
  const value = value_of(doc, filter);
  return filter === "owner" ? owner_key(value) : value;
}
function pick_matches(doc, filter, pick, value_of) {
  const value = pick_value(doc, filter, value_of);
  return pick === OWNER_ASSIGNED && filter === "owner" ? value !== OWNER_UNASSIGNED : value === pick;
}
function doc_passes(doc, filters, skip_filter, value_of) {
  const select_matches = SELECT_FILTERS.every((filter) => filter === skip_filter || filters[filter] === "" ||
    pick_matches(doc, filter, filters[filter], value_of));
  return select_matches && (!filters.waiting || Boolean(doc.waiting_on));
}

// The values for one select filter's list: those on docs that pass every other filter, plus its own pick so it can
// be cleared. Callers scope docs to the picked repo. A pick no doc in all_docs has any more is dropped, so the
// combo resets it instead of leaving an empty board.
function facet_choices(docs, filters, filter, value_of, all_docs = docs) {
  const values = new Set(docs.filter((doc) => doc_passes(doc, filters, filter, value_of))
    .map((doc) => pick_value(doc, filter, value_of)));
  if (filter === "owner" && [...values].some((value) => value !== OWNER_UNASSIGNED)) values.add(OWNER_ASSIGNED);
  if (filters[filter] !== "" && all_docs.some((doc) => pick_matches(doc, filter, filters[filter], value_of))) {
    values.add(filters[filter]);
  }
  // The NUL-prefixed rows sort first, so the two special owner rows stay on top.
  return [...values].sort();
}
// The two role rows mean the same in any repo. A session name is a per-repo habit, so it does not carry over.
const keeps_owner_on_repo_switch = (owner) => owner === OWNER_ASSIGNED || owner === OWNER_UNASSIGNED;

// Each real owner name gets one of the five assignee accents. Names are taken in sorted order and a name whose hashed
// slot is taken probes to the next free one, so the same board always paints the same way. Past five names the
// slots fill up and colors repeat. "none", empty and NUL-prefixed synthetic rows get no entry, so they stay gray.
const ASSIGNEE_SLOTS = ["--assignee-orange", "--assignee-teal", "--assignee-sky", "--assignee-iris", "--assignee-magenta"];
function assign_owner_colors(names) {
  const real = [...new Set(names)].filter((name) => name && name !== "none" && !name.startsWith("\u0000")).sort();
  const colors = new Map();
  const taken = new Set();
  for (const name of real) {
    let slot = [...name].reduce((hash, char) => Math.imul(hash ^ char.codePointAt(0), 16777619) >>> 0, 2166136261) % ASSIGNEE_SLOTS.length;
    if (taken.size === ASSIGNEE_SLOTS.length) taken.clear();
    while (taken.has(slot)) slot = (slot + 1) % ASSIGNEE_SLOTS.length;
    taken.add(slot);
    colors.set(name, ASSIGNEE_SLOTS[slot]);
  }
  return colors;
}
// fuzzy:end

// markdown:start
// The doc view's renderer, for the markdown subset plan docs use. The doc text comes from disk and this page can
// write, so each line is escaped whole before any markup goes in, and markup comes only from the fixed tags here. A
// link keeps only an http(s) target or an issue ref. Anything else stays escaped text.
const MD_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const MD_SAFE_URL = /^https?:\/\/\S+$/i;
// A held piece of finished markup, so later patterns cannot match inside it. The input loses its NUL characters
// first, so a doc cannot forge one.
const MD_HOLD = /\u0000(\d+)\u0000/g;

function escape_html(text) {
  return String(text).replace(/[&<>"']/g, (character) => MD_ESCAPES[character]);
}

function md_link(href, label) {
  return `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}

// `escaped` is already escaped. issue_href(n) gives the target of a #N ref, or null to leave it as text.
function md_inline(escaped, issue_href) {
  const held = [];
  const hold = (html) => `\u0000${held.push(html) - 1}\u0000`;
  let text = escaped.replace(/`([^`]+)`/g, (whole, code) => hold(`<code>${code}</code>`));
  text = text.replace(/\[([^\]]+)\]\(([^)\s\u0000]+)\)/g, (whole, label, url) => (MD_SAFE_URL.test(url) ? hold(md_link(url, label)) : whole));
  // Escaped text holds & only as an entity, so &amp; is the one entity a bare link may span. The others end it.
  text = text.replace(/(^|[^\w/=])(https?:\/\/(?:[^\s&\u0000]|&amp;)+?)([.,;:!?)\]*_]*(?=\s|&(?!amp;)|\u0000|$))/g,
    (whole, before, url, after) => `${before}${hold(md_link(url, url))}${after}`);
  // Not after & (the &#39; entity), a word, a slash (other/repo#12) or another #.
  text = text.replace(/(^|[^\w&/#])#(\d+)\b/g, (whole, before, number) => {
    const href = issue_href ? issue_href(Number(number)) : null;
    return href && MD_SAFE_URL.test(href) ? `${before}${hold(md_link(escape_html(href), `#${number}`))}` : whole;
  });
  text = text.replace(/\*\*(?=\S)(.*?\S)\*\*/g, (whole, inner) => `<strong>${inner}</strong>`);
  text = text.replace(/(^|[^\w])__(?=\S)(.*?\S)__(?!\w)/g, (whole, before, inner) => `${before}<strong>${inner}</strong>`);
  text = text.replace(/(^|[^\w*])\*([^\s*]|[^\s*][^*]*?[^\s*])\*(?![\w*])/g,
    (whole, before, inner) => `${before}<em>${inner}</em>`);
  // Single _ only at word edges, so snake_case names stay whole.
  text = text.replace(/(^|[^\w])_([^\s_]|[^\s_][^_]*?[^\s_])_(?!\w)/g, (whole, before, inner) => `${before}<em>${inner}</em>`);
  // A held piece holds only earlier pieces (code in a link label), so the recursion ends.
  const restore = (piece) => piece.replace(MD_HOLD, (whole, index) => restore(held[Number(index)]));
  return restore(text);
}

function md_front_matter(lines) {
  const rows = lines.map((line) => {
    const pair = /^([^:\s][^:]*):\s?(.*)$/.exec(line);
    return pair ? `<tr><th>${escape_html(pair[1])}</th><td>${escape_html(pair[2])}</td></tr>`
      : `<tr><td colspan="2">${escape_html(line)}</td></tr>`;
  });
  // Collapsed, because the card's badges already show the keys that matter most.
  return `<details class="front-matter"><summary>Fields (${rows.length})</summary><table>${rows.join("")}</table></details>`;
}

const MD_FENCE = /^\s*(`{3,}|~{3,})/;
const MD_HEADING = /^(#{1,6})\s+(.*?)(\s+#+)?\s*$/;
const MD_RULE = /^\s*([-*_])(\s*\1){2,}\s*$/;
const MD_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const MD_TASK = /^\[([ xX])\]\s+(.*)$/;
// A section heading as parse.HEADING reads it, which is narrower than MD_HEADING. Only these get an edit button.
const MD_SECTION = /^## +(.*?) *$/;
const MD_TASK_MARK = /^(\s*(?:[-*+]|\d+[.)])\s+\[)[xX]/;
const MD_TABLE = /^\s*\|/;

// Headings, nested bullet and numbered lists, task items as checkboxes, fenced code, rules, and the front matter as a
// key/value table. A table stays its plain text in a pre block. Checkboxes are disabled unless options.editable is
// set. Then each task item carries its source line and which of the lines that read the same it is (data-line,
// data-nth), the way the server finds it, and each section heading carries its title (data-section).
function render_markdown(text, options = {}) {
  const inline = (line) => md_inline(escape_html(line), options.issue_href);
  const lines = String(text).replace(/\u0000/g, "�").replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let at = 0;
  if (lines[0] === "---") {
    const end = lines.indexOf("---", 1);
    if (end > 0) {
      out.push(md_front_matter(lines.slice(1, end)));
      at = end + 1;
    }
  }
  let paragraph = [];
  const lists = [];
  const task_counts = new Map();
  const section_titles = new Set();
  const flush_paragraph = () => {
    if (paragraph.length) out.push(`<p>${paragraph.map(inline).join("\n")}</p>`);
    paragraph = [];
  };
  const close_lists = (indent) => {
    while (lists.length && lists[lists.length - 1].indent > indent) out.push(`</li></${lists.pop().tag}>`);
  };
  const end_block = () => { flush_paragraph(); close_lists(-1); };
  for (; at < lines.length; at += 1) {
    const line = lines[at];
    const fence = MD_FENCE.exec(line);
    if (fence) {
      // A fence indented under a list item stays in that item.
      if (/^\s/.test(line) && lists.length) flush_paragraph();
      else end_block();
      const body = [];
      for (at += 1; at < lines.length && !lines[at].trim().startsWith(fence[1]); at += 1) body.push(lines[at]);
      out.push(`<pre><code>${escape_html(body.join("\n"))}</code></pre>`);
      continue;
    }
    if (!line.trim()) { end_block(); continue; }
    const heading = MD_HEADING.exec(line);
    if (heading) {
      end_block();
      const section = options.editable && MD_SECTION.exec(line);
      // The server edits the first section of a title, so a repeat gets no button.
      const title = section && !section_titles.has(section[1]) ? section[1] : null;
      if (title !== null) section_titles.add(title);
      const attribute = title !== null ? ` data-section="${escape_html(title)}"` : "";
      out.push(`<h${heading[1].length}${attribute}>${inline(heading[2])}</h${heading[1].length}>`);
      continue;
    }
    if (MD_RULE.test(line)) { end_block(); out.push("<hr>"); continue; }
    if (MD_TABLE.test(line)) {
      end_block();
      const rows = [];
      for (; at < lines.length && MD_TABLE.test(lines[at]); at += 1) rows.push(lines[at]);
      at -= 1;
      out.push(`<pre class="table">${escape_html(rows.join("\n"))}</pre>`);
      continue;
    }
    const item = MD_ITEM.exec(line);
    if (item) {
      flush_paragraph();
      const indent = item[1].replace(/\t/g, "    ").length;
      const tag = /\d/.test(item[2]) ? "ol" : "ul";
      close_lists(indent);
      const top = lists[lists.length - 1];
      if (top && top.indent === indent && top.tag !== tag) out.push(`</li></${lists.pop().tag}>`);
      const same_list = lists.length && lists[lists.length - 1].indent === indent;
      if (same_list) {
        out.push("</li>");
